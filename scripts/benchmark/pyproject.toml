[project]
name = "benchmark"
version = "0.0.1"
description = "Benchmark package resolution tools"
requires-python = ">=3.11"
dependencies = [
  "astral-dev-toolchain-hyperfine==2.0.0",
  "pdm",
  "pip-tools",
  "poetry",
  "tomli",
  "tomli_w",
  "virtualenv",
  "pipx",
]

[project.scripts]
resolver = "benchmark.resolver:main"
tools = "benchmark.tools:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
no-build = true
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
no-binary-package = ["benchmark"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    { requirement = "uv-build==0.12.3", hashes = [
        "sha256:322d634f2fbf8c7965dde52106db8040b0cc23dbc07b6508d900f217843bd129",
        "sha256:39adb84a210edaffc4eab8f59a2fc66579d08ea4e75acd3f36548f33f4a3eefc",
        "sha256:3bdf349e221a93544c940157361d22e5b6d73bc9bd1b302364461d8afd46479a",
        "sha256:3f6cda73d200e755d8aec6492af22c279ce69e460241a5f7507eba4aeb08abb7",
        "sha256:48117d0f8d7be3e88f2e8e63e608873bc2aa950f5d9c3a845650e41632dfd0e9",
        "sha256:52d1bb3e76217f4ece4fb2b89a7536d481af087567d83428cc72d570b540f3df",
        "sha256:6d0d59550fc9498087c071e9c842c87cd5288e0f8bda4888a633d6be79c3178c",
        "sha256:7b9bd7b737e8e79370684c959e9500eb32fee44efc396d51ab11ca598d1596a2",
        "sha256:7f13598c88b44a9b46c5d74370a0c12954f2e328d9193e80358a38edf95c7608",
        "sha256:855dbaf6912805e70ae1c788a282dc023d69f6acaec0955d14e57759017e11de",
        "sha256:9bc47530837f8a544c7a9e11e6636a950bc68aac1837462052dc180f45318f96",
