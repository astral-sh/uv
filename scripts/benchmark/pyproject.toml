[project]
name = "benchmark"
version = "0.0.1"
description = "Benchmark package resolution tools"
requires-python = ">=3.11"
dependencies = [
  "astral-dev-toolchain-hyperfine==2.0.0",
  "pdm",
  "pip-tools",
  "poetry",
  "tomli",
  "tomli_w",
  "virtualenv",
  "pipx",
]

[project.scripts]
resolver = "benchmark.resolver:main"
tools = "benchmark.tools:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
no-build = true
no-binary-package = ["benchmark"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    "uv-build==0.12.3",
]
exclude-newer = "P7D"

[tool.uv.exclude-newer-package]
astral-dev-toolchain-hyperfine = "2026-10-08T08:11:00Z"

[tool.uv.build-backend]
source-include = [".python-version", "README.md", "uv.lock"]
