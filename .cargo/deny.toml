    "crossbeam-utils",
    "crunchy",
    "erased-serde",
    "fs-err",
    "generic-array",
    "getrandom",
    "httparse",
    "icu_normalizer_data",
    "icu_properties_data",
    "io-extras",
    "io-lifetimes",
    "jni",
    "jni-macros",
    "libc",
    "libm",
    "libmimalloc-sys",
    "memoffset",
    "mime_guess",
    "nix",
    "num-bigint-dig",
    "num-traits",
    "objc2",
    "oid-registry",
    "owo-colors",
    "parking_lot_core",
    "portable-atomic",
    "portable-atomic-util",
