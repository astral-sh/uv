[package]
name = "uv-performance-memory-allocator"
version = "0.0.100"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false
test = false

[target.'cfg(all(target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1.50", default-features = false, features = ["v2"] }

[target.'cfg(all(not(any(target_os = "windows", target_os = "openbsd", target_os = "freebsd", target_os = "haiku")), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64")))'.dependencies]
tikv-jemallocator = { version = "0.6.0", default-features = false, features = ["background_threads_runtime_support"] }
