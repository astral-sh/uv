name = "python-greater-than-current-backtrack"
description = "The user requires a package where five recent versions have distinct Python requirements incompatible with the current version, but an older version is compatible. The repeated conflicts must not change the fixed priority of the Python version constraint."

[root]
requires = ["a"]

[expected]
satisfiable = true

[expected.packages]
a = "1.0.0"

[packages.a.versions."1.0.0"]
requires_python = ">=3.9"

[packages.a.versions."2.0.0"]
requires_python = ">=3.10"

[packages.a.versions."3.0.0"]
requires_python = ">=3.11"

[packages.a.versions."4.0.0"]
requires_python = ">=3.12"

[packages.a.versions."5.0.0"]
requires_python = ">=3.13"

[packages.a.versions."6.0.0"]
requires_python = ">=3.14"

[environment]
python = "3.9"
