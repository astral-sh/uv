name: "Load issue context"
description: "Load an issue-context branch into a caller-owned local directory."

inputs:
  issue-number:
    description: "The issue whose context branch should be loaded."
    required: true
  repository:
    description: "The repository containing the issue-context branch."
    default: "astral-sh/uv-dev"
    required: false
  path:
    description: "A destination inside the workspace or runner temporary directory."
    required: true

outputs:
  head-sha:
    description: "The verified issue-context branch revision."
    value: ${{ steps.load.outputs.head-sha }}
  path:
    description: "The absolute destination containing the issue-context branch."
    value: ${{ steps.load.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: "Load issue-context branch"
      id: load
      shell: bash
      env:
        DIRECTORY: ${{ inputs.path }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
          ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
          ! [[ "$DIRECTORY" =~ ^[A-Za-z0-9_./-]+$ ]]; then
          echo "The issue-context source or destination is invalid." >&2
          exit 1
        fi

        resolve_path() {
          python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$1"
        }
        directory="$(resolve_path "$DIRECTORY")"
        runner_temp="$(resolve_path "$RUNNER_TEMP")"
        workspace="$(resolve_path "$GITHUB_WORKSPACE")"
        case "$directory" in
          "$runner_temp"/*|"$workspace"/*) ;;
          *)
            echo "The issue-context destination must be inside the runner or workspace." >&2
            exit 1
            ;;
        esac

        if [ -e "$directory" ]; then
          echo "The issue-context destination already exists." >&2
          exit 1
        fi

        git -c core.hooksPath=/dev/null init --quiet "$directory"
        git -C "$directory" -c core.hooksPath=/dev/null remote add origin \
          "https://github.com/$REPOSITORY.git"
        git -C "$directory" -c core.hooksPath=/dev/null fetch --quiet --no-tags \
          origin "refs/heads/issue/$ISSUE_NUMBER"
        git -C "$directory" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD

        if ! jq --exit-status --argjson issue_number "$ISSUE_NUMBER" \
          '.number == $issue_number' "$directory/issue.json" > /dev/null; then
          echo "The issue-context branch does not match the requested issue." >&2
          exit 1
        fi

        printf 'head-sha=%s\n' "$(git -C "$directory" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        printf 'path=%s\n' "$directory" >> "$GITHUB_OUTPUT"
