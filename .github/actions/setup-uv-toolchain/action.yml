name: "Set up uv for toolchain commands"
description: "Install uv and locate the workflow revision's toolchain project."

inputs:
  enable-cache:
    description: "Cache uv dependencies from the checkout (true or auto), or run setup in the action directory (false)."
    default: "false"

outputs:
  project:
    description: "Path to the uv project containing the workflow's locked tools."
    value: ${{ steps.release.outputs.project }}

runs:
  using: "composite"
  steps:
    - name: "Select uv release"
      id: release
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        project=$PWD
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            uv_version="0.13.6"
            uv_checksum="f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
            ;;
          macOS/ARM64)
            uv_version="0.13.6"
            uv_checksum="60fbd5c8a1ed681845eea28d9d622fcde03c51e91a43465b64a1e17db1ed3472"
            ;;
          Windows/X64)
            uv_version="0.13.6"
            uv_checksum="a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f"
            project=$(cygpath -m "$PWD")
            ;;
          *)
            echo "Unsupported uv runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        {
          echo "version=$uv_version"
          echo "checksum=$uv_checksum"
          echo "project=$project"
        } >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ steps.release.outputs.version }}
        checksum: ${{ steps.release.outputs.checksum }}
        enable-cache: ${{ inputs.enable-cache }}
        working-directory: ${{ inputs.enable-cache == 'false' && github.action_path || github.workspace }}
