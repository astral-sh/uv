name: "Set up uv for toolchain commands"
description: "Install uv and locate the workflow revision's toolchain project."

inputs:
  enable-cache:
    description: "Cache uv dependencies from the checkout (true or auto), or run setup in the action directory (false)."
    default: "false"

outputs:
  project:
    description: "Path to the uv project containing the workflow's locked tools."
    value: ${{ steps.release.outputs.project }}

runs:
  using: "composite"
  steps:
    - name: "Select uv release"
      id: release
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        project=$PWD
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            uv_version="0.13.5"
            uv_checksum="f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
            ;;
          macOS/ARM64)
            uv_version="0.13.5"
            uv_checksum="743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73"
            ;;
          Windows/X64)
            uv_version="0.13.5"
            uv_checksum="a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"
            project=$(cygpath -m "$PWD")
            ;;
          *)
            echo "Unsupported uv runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        {
          echo "version=$uv_version"
          echo "checksum=$uv_checksum"
          echo "project=$project"
        } >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ steps.release.outputs.version }}
        checksum: ${{ steps.release.outputs.checksum }}
        enable-cache: ${{ inputs.enable-cache }}
        working-directory: ${{ inputs.enable-cache == 'false' && github.action_path || github.workspace }}
