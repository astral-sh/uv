# Publish uv releases to a mirror
#
# Assumed to run as a subworkflow of .github/workflows/release.yml as a custom publish job
name: publish-mirror

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      github-artifacts:
        description: "Artifact IDs for the complete GitHub release assets and manifest"
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  publish-mirror:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    env:
      VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.github-artifacts }}
          path: artifacts
          merge-multiple: true
      - name: "Upload to R2"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
          PROJECT: uv
        run: |
          # R2 recommends single-part uploads for files under approximately 100 MB.
          # AWS CLI interprets 100MB as 100 MiB. Current release artifacts are under
          # this threshold. If we have larger artifacts, we will need to add additional
          # retry handling because `--no-overwrite` does not make multipart retries
          # idempotent against the immutable bucket.
          # https://developers.cloudflare.com/r2/objects/upload-objects/#choose-an-upload-method
          aws configure set default.s3.multipart_threshold 100MB

          aws s3 sync --no-overwrite --output table --color on \
            --exclude '*' \
            --include '*.zip' --include '*.zip.sha256' \
            --include '*.tar.gz' --include '*.tar.gz.sha256' \
            --include sha256.sum --include '*.ps1' --include '*.sh' \
            --cache-control "public, max-age=31536000, immutable" \
            artifacts/ \
            s3://${R2_BUCKET}/github/$PROJECT/releases/download/$VERSION/
      - name: "Upload latest installers to R2"
        if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
        run: |
          for installer in uv-installer.sh uv-installer.ps1; do
            aws s3 cp --output table --color on \
              --cache-control "public, max-age=300" \
              "artifacts/${installer}" \
              "s3://${R2_BUCKET}/installers/uv/latest/${installer}"
          done
