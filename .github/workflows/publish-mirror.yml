# Publish uv releases to a mirror
#
# Assumed to run as a subworkflow of .github/workflows/release.yml as a custom publish job
name: publish-mirror

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      github-artifacts:
        description: "Artifact IDs for the complete GitHub release assets and manifest"
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  publish-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release
    env:
      VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          enable-cache: false
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.github-artifacts }}
          path: artifacts
          merge-multiple: true
      - name: "Check release asset inventory"
        run: uv run scripts/list-release-artifacts.py github artifacts/dist-manifest.json artifacts --include-manifest > "$RUNNER_TEMP/release-assets.txt"
      - name: "Upload to R2"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
          PROJECT: uv
        run: |
          while IFS= read -r asset; do
            # The mirror contains the release assets, not cargo-dist's manifest.
            [[ "${asset##*/}" == dist-manifest.json ]] && continue
            aws s3 cp --output table --color on \
              --cache-control "public, max-age=31536000, immutable" \
              "$asset" "s3://${R2_BUCKET}/github/$PROJECT/releases/download/$VERSION/${asset##*/}"
          done < "$RUNNER_TEMP/release-assets.txt"
      - name: "Upload latest installers to R2"
        if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
        run: |
          for installer in uv-installer.sh uv-installer.ps1; do
            aws s3 cp --output table --color on \
              --cache-control "public, max-age=300" \
              "artifacts/${installer}" \
              "s3://${R2_BUCKET}/installers/uv/latest/${installer}"
          done
