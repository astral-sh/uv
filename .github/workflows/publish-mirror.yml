# Publish uv releases to a mirror
#
# Assumed to run as a subworkflow of .github/workflows/release.yml as a custom publish job
name: publish-mirror

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      github-artifacts:
        description: "Artifact IDs for the complete GitHub release assets and manifest"
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  publish-mirror:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    env:
      VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.github-artifacts }}
          path: artifacts
          merge-multiple: true
      - name: "Upload to R2"
        uses: astral-sh/github-actions/upload-r2@2026.11.19.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
        with:
          account-id: ${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}
          bucket: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
          source-directory: artifacts
          include: |
            *.zip
            *.zip.sha256
            *.tar.gz
            *.tar.gz.sha256
            sha256.sum
            *.ps1
            *.sh
          prefix: github/uv/releases/download/${{ env.VERSION }}
          if-exists: skip
          cache-control: public, max-age=31536000, immutable
      - name: "Upload latest installers to R2"
        if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
        uses: astral-sh/github-actions/upload-r2@2026.11.19.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
        with:
          account-id: ${{ secrets.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}
          bucket: ${{ secrets.MIRROR_R2_BUCKET_NAME }}
          source-directory: artifacts
          include: |
            uv-installer.sh
            uv-installer.ps1
          prefix: installers/uv/latest
          if-exists: overwrite
          cache-control: public, max-age=300
