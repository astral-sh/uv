on:
  workflow_call:
    inputs:
      code-changed:
        required: true
        type: string
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=astral-sh/hawk
  HAWK_VERSION: 0.1.15
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1
  UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json

jobs:
  ruff:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv run --only-group check ruff check .

  ty:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # `uv check` checks the entire repository; keep this scoped to the Python package.
      - run: uv run --only-group check ty check python/uv
      - name: "Check scrolls"
        env:
          UV_PREVIEW_FEATURES: check-command,workspace-list-scripts
        run: |
          set -e -o pipefail
          uv workspace list --scripts |
          while IFS= read -r script; do
            printf 'Checking %s\n' "$script" >&2
            uv check --script "$script" --locked
          done

  shellcheck:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install shellcheck"
        run: |
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          SHELLCHECK_VERSION="v0.11.0"
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJf -
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
      - name: "Run shellcheck"
        run: find . -name '*.sh' -type f | xargs shellcheck --shell bash --severity style

  validate-pyproject:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: "Validate pyproject and uv schema"
        run: ./scripts/validate-pyproject.sh

  readme:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
      - run: python scripts/transform_readme.py --target pypi

  clippy-ubuntu:
    name: "clippy on linux"
    timeout-minutes: 10
    if: ${{ inputs.code-changed == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup component add clippy

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}
      - name: "Clippy"
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --workspace --all-targets --all-features --locked

  clippy-windows:
    name: "clippy on windows"
    timeout-minutes: 15
    if: ${{ inputs.code-changed == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: namespace-profile-windows-2022-x86-64-4
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - name: "Install Rust toolchain"
        run: rustup component add clippy

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          workspace: ${{ env.UV_WORKSPACE }}
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Clippy"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --workspace --all-targets --all-features --locked

  cargo-deny:
    name: "cargo deny"
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: "Check licenses"
        run: uv run --only-dev cargo deny --all-features check licenses
      - name: "Check sources"
        run: uv run --only-dev cargo deny --all-features check sources
      - name: "Check workspace dependency features and build-script allowlist"
        run: uv run --no-project scripts/check-cargo-bans.py
      - name: "Check bans"
        run: uv run --only-dev cargo deny --all-features check bans
      - name: "Check uv_build dependencies"
        run: |
          uv run --only-dev cargo deny --manifest-path crates/uv-build/Cargo.toml --all-features check bans

  hawk:
    timeout-minutes: 15
    if: ${{ inputs.code-changed == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/hawk"
          cache-workspace-crates: "false"
          save-if: ${{ inputs.save-rust-cache == 'true' }}
      - name: "Install Rust toolchain"
        run: rustup toolchain install 1.99.0
      - name: "Install Hawk"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
      - name: "Hawk"
        run: cargo +1.99.0 hawk check --target-dir target/hawk -D warnings

  shear:
    name: "cargo shear"
    timeout-minutes: 10
    # `cargo shear` needs `cargo metadata` and the Rust toolchain.
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv run --only-group check cargo-shear --deny-warnings

  typos:
    name: "check for typos"
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - run: uv run --only-group check typos
