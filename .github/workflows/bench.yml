on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  benchmarks-walltime-build:
    name: "walltime build"
    # codspeed-macro doesn't support Ubuntu 24.04 yet
    runs-on: depot-ubuntu-22.04-arm-4
    if: ${{ github.repository_owner == 'astral-sh' && (github.repository == 'astral-sh/uv' || github.ref != 'refs/heads/main') }}
    timeout-minutes: 30
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Build benchmarks"
        run: cargo codspeed build -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery

      - name: "Create artifact archive"
        run: tar -cvf benchmarks-walltime.tar target/codspeed target/debug/uv .cache

      - name: "Upload benchmark artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-walltime
          path: benchmarks-walltime.tar
          retention-days: 1

  benchmarks-walltime-run:
    name: "walltime on aarch64 linux"
    runs-on: codspeed-macro
    needs: benchmarks-walltime-build
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Download benchmark artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-walltime

      - name: "Extract artifact archive"
        run: tar -xvf benchmarks-walltime.tar

      - name: "Create venv"
        run: ./target/debug/uv venv --cache-dir .cache

      - name: "Retain public main profiles"
        id: profiles
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-walltime" walltime >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: cargo codspeed run
          mode: walltime
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: python3 scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-walltime"

      - name: "Upload public main profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-walltime
          path: |
            ${{ runner.temp }}/codspeed-walltime/metadata.json
            ${{ runner.temp }}/codspeed-walltime/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  benchmarks-simulated:
    name: "simulated"
    runs-on: depot-ubuntu-24.04-4
    if: ${{ github.repository_owner == 'astral-sh' && (github.repository == 'astral-sh/uv' || github.ref != 'refs/heads/main') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Build benchmarks"
        run: cargo codspeed build --profile profiling -p uv-bench

      - name: "Retain public main profiles"
        id: profiles
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-simulation" simulation >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: cargo codspeed run
          mode: simulation
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: python3 scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-simulation"

      - name: "Upload public main profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-simulation
          path: |
            ${{ runner.temp }}/codspeed-simulation/metadata.json
            ${{ runner.temp }}/codspeed-simulation/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  benchmarks-import:
    name: "import public main profiles"
    if: ${{ (github.repository == 'astral-sh/uv-dev' || github.repository == 'astral-sh/uv-security') && github.ref == 'refs/heads/main' }}
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 75
    environment: automations
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Find public main profiles"
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/codspeed-profiles.py find "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: "Get public benchmark artifact token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            actions: read

      - name: "Download public main profiles"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ steps.token.outputs.token }}
          repository: astral-sh/uv
          run-id: ${{ steps.source.outputs.run-id }}
          pattern: codspeed-profiles-*
          path: ${{ runner.temp }}/codspeed-profiles

      - name: "Import public main profiles"
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run-id }}
        run: python3 scripts/codspeed-profiles.py import "$RUNNER_TEMP/codspeed-profiles" "$SOURCE_RUN"
