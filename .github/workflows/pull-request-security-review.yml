on:
  workflow_call:
    inputs:
      threat-models:
        description: "Threat model directory in the caller repository"
        type: string
        default: agents/references
      setup-command:
        description: "Bash commands to run at the caller workflow revision before checking out the PR"
        type: string
        default: ""
      runner:
        description: "Linux x86-64 runner for the security review"
        type: string
        default: ubuntu-latest
      helper-runner:
        description: "Linux x86-64 runner for preparing and publishing findings"
        type: string
        default: ubuntu-latest
      uv-version:
        description: "uv version used for repository setup and review scripts"
        type: string
        required: true
      uv-checksum:
        description: "SHA-256 of the Linux x86-64 uv release archive"
        type: string
        required: true
    outputs:
      result:
        description: "The security review result"
        value: ${{ jobs.review.outputs.result }}
      comments:
        description: "The prepared GitHub review comments"
        value: ${{ jobs.prepare.outputs.result }}

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  review:
    name: "security review"
    runs-on: ${{ inputs.runner }}
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.final-message }}
    steps:
      - name: Checkout review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: agents/security-pr-review
          persist-credentials: false

      - name: Save review implementation
        run: cp -R agents/security-pr-review "$RUNNER_TEMP/pull-request-review-source"

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          checksum: ${{ inputs.uv-checksum }}

      - name: Set up caller repository
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Prepare review configuration
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THREAT_MODELS: ${{ inputs.threat-models }}
        run: bash "$RUNNER_TEMP/pull-request-review-source/scripts/setup.sh"

      - name: "Checkout Codex Security plugin"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/plugins
          ref: 1e285826e604f66f7208f7ac4dba0fe8341d1f57
          path: .codex-security-plugin
          sparse-checkout: |
            .agents/plugins
            plugins/codex-security
          persist-credentials: false

      - name: "Install Codex Security plugin"
        run: '"$REVIEW_CONFIG/scripts/install-codex-security.sh" "$REVIEW_CONFIG/codex"'

      - name: "Collect pull request context"
        run: bash "$REVIEW_CONFIG/scripts/collect-context.sh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # codex-action configures these only on GitHub-hosted runners.
      - name: "Enable Linux user namespaces for bubblewrap"
        run: |
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: "Review pull request"
        id: review
        uses: openai/codex-action@c385816875cc2fc8e033ed9d1cba96f8c331210e # v1.11 + GitHub API retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}/codex-security
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.153.4"
          codex-home: "${{ env.REVIEW_CONFIG }}/codex"
          model: gpt-5.6-sol
          effort: xhigh
          permission-profile: "pull-request-review"
          safety-strategy: drop-sudo
          allow-bot-users: "astral-automations-bot[bot],renovate[bot]"
          prompt-file: "${{ runner.temp }}/pull-request-security-review-prompt.md"
          output-schema-file: "${{ env.REVIEW_CONFIG }}/schema.json"
          output-file: "${{ runner.temp }}/pull-request-review-result.json"

      - name: "Check review coverage"
        if: steps.review.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$REVIEW_CONFIG/scripts/check-coverage.sh"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-pull-request-security-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REVIEW_CONFIG }}/codex/sessions
          if-no-files-found: warn

  prepare:
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ${{ inputs.helper-runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.comments.outputs.result }}
    steps:
      - name: Checkout review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: agents/security-pr-review
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ inputs.uv-version }}
          checksum: ${{ inputs.uv-checksum }}

      - name: "Prepare review findings"
        id: comments
        run: bash agents/security-pr-review/scripts/prepare.sh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.outputs.result }}

  report:
    needs: prepare
    if: needs.prepare.outputs.result != '' && fromJSON(needs.prepare.outputs.result).comments[0] != null
    runs-on: ${{ inputs.helper-runner }}
    environment: automations
    timeout-minutes: 5
    permissions:
      id-token: write # for the credential broker
    steps:
      - name: "Get repository token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: "Publish review findings"
        run: |
          set -euo pipefail

          printf '%s\n' "$REVIEW_RESULT" > "$RUNNER_TEMP/review.json"

          if jq --exit-status '.comments | length == 0' "$RUNNER_TEMP/review.json" > /dev/null; then
            echo "No actionable findings to publish."
            exit 0
          fi

          current_head_sha="$(
            gh pr view "$PULL_REQUEST_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq '.headRefOid'
          )"
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "The pull request head changed; skipping stale review findings."
            exit 0
          fi

          jq --compact-output '.comments[]' "$RUNNER_TEMP/review.json" |
          while IFS= read -r comment; do
            printf '%s\n' "$comment" |
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER/comments" \
                --input - \
                --silent
          done
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_RESULT: ${{ needs.prepare.outputs.result }}
