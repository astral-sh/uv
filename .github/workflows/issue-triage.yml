# Analyze newly opened issues and persist their triage context.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string

permissions: {}

jobs:
  triage:
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-context: ${{ steps.issue.outputs.context }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,url \
            > .issue-triage-event.json

          if ! jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.url | startswith("https://github.com/\($repository)/issues/")' \
            .issue-triage-event.json > /dev/null; then
            echo "The issue must belong to $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          jq --raw-output '"context=\(tojson)"' \
            .issue-triage-event.json >> "$GITHUB_OUTPUT"

          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$(jq -r '.number' .issue-triage-event.json)" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: "agents/codex"
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-issue-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/codex/sessions
          if-no-files-found: warn

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ fromJSON(needs.triage.outputs.issue-context).number }}
      cancel-in-progress: false
    permissions:
      id-token: write # for the cross-repository issue-context credential broker
    steps:
      - name: "Prepare issue context"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > "$RUNNER_TEMP/issue.json"
          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          jq --null-input --raw-output \
            --arg repository "$GITHUB_REPOSITORY" \
            --slurpfile issue "$RUNNER_TEMP/issue.json" \
            --slurpfile triage "$RUNNER_TEMP/triage.json" '
              $issue[0] as $issue |
              $triage[0] as $triage |
              [
                "# \($issue.title)",
                "",
                "Issue: \($repository)#\($issue.number)",
                "Classification: \($triage.type)",
                "",
                "## Summary",
                "",
                $triage.summary,
                "",
                "## Classification",
                "",
                $triage.type_reason,
                "",
                "## Related",
                "",
                (
                  if $triage.related.items | length > 0 then
                    $triage.related.items[] |
                    "- \(.url) (\(.state) \(.kind | gsub("_"; " "))): \(.title)\n  \(.reason)"
                  else
                    "No related issues or pull requests found."
                  end
                )
              ] | join("\n")
            ' > "$RUNNER_TEMP/README.md"
          printf '%s\n%s\n%s\n' '```json' "$TRIAGE_RESULT" '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_CONTEXT: ${{ needs.triage.outputs.issue-context }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # Linking an upstream issue to a fork branch requires both permissions on one token.
          permissions: |
            contents: write
            issues: write

      - name: "Persist issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git"

          gh issue develop "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --branch-repo astral-sh/uv-dev \
            --base issue/base \
            --name "$branch" \
            --checkout

          cp "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/triage.json" "$RUNNER_TEMP/README.md" .
          git add issue.json triage.json README.md

          if git diff --cached --quiet; then
            echo "The existing issue context is unchanged."
            exit 0
          fi

          git \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit --message "Update issue context for $GITHUB_REPOSITORY#$issue_number"
          git push origin "HEAD:refs/heads/$branch"

          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/%s\n' "$branch" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  reproduce-bug:
    needs: triage
    if: needs.triage.outputs.result != '' && fromJSON(needs.triage.outputs.result).type == 'bug'
    permissions:
      contents: read
      id-token: write
      issues: read
    uses: ./.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      runner: ubuntu-latest
    secrets: inherit # zizmor: ignore[secrets-inherit] -- protected environment secrets are needed for reproduction
