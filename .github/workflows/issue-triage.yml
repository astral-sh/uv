# Analyze newly opened issues and persist their triage context.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string

permissions: {}

jobs:
  initialize-context:
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for the cross-repository issue-context credential broker
      issues: read
    outputs:
      issue-context: ${{ steps.issue.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,url \
            > "$RUNNER_TEMP/issue.json"

          if ! jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.url | startswith("https://github.com/\($repository)/issues/")' \
            "$RUNNER_TEMP/issue.json" > /dev/null; then
            echo "The issue must belong to $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          jq --raw-output '"context=\(tojson)"' \
            "$RUNNER_TEMP/issue.json" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # Linking an upstream issue to a fork branch requires both permissions on one token.
          permissions: |
            contents: write
            issues: write

      - name: "Initialize issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git"

          gh issue develop "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --branch-repo astral-sh/uv-dev \
            --base issue/base \
            --name "$branch" \
            --checkout

          if [ -f README.md ]; then
            echo "The existing issue context has already been initialized."
            exit 0
          fi

          cp "$GITHUB_WORKSPACE/agents/templates/issue-context-template.md" README.md
          cp "$RUNNER_TEMP/issue.json" issue.json
          git add issue.json README.md

          git \
            -c user.name="astral-automations-bot[bot]" \
            -c user.email="305554984+astral-automations-bot[bot]@users.noreply.github.com" \
            commit --message "Initialize issue context"
          git push origin "HEAD:refs/heads/$branch"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  triage:
    needs: initialize-context
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-context: ${{ needs.initialize-context.outputs.issue-context }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Prepare issue triage"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > .issue-triage-event.json
          issue_number="$(jq --raw-output '.number' .issue-triage-event.json)"

          git init --quiet "$RUNNER_TEMP/issue-context"
          git -C "$RUNNER_TEMP/issue-context" fetch --quiet --depth 1 \
            https://github.com/astral-sh/uv-dev.git \
            "refs/heads/issue/$issue_number"
          git -C "$RUNNER_TEMP/issue-context" checkout --quiet FETCH_HEAD

          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$issue_number" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"
        env:
          ISSUE_CONTEXT: ${{ needs.initialize-context.outputs.issue-context }}

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          codex-home: "agents/codex"
          effort: high
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload issue context"
        if: steps.triage.outputs.final-message != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context/README.md
          if-no-files-found: error
          retention-days: 1

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-issue-${{ fromJSON(needs.initialize-context.outputs.issue-context).number }}
          path: agents/codex/sessions
          if-no-files-found: warn
          overwrite: true

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ fromJSON(needs.triage.outputs.issue-context).number }}
      cancel-in-progress: false
    permissions:
      id-token: write # for the uv-dev issue-context credential broker
    steps:
      - name: "Download issue context"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context-update

      - name: "Prepare issue context"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > "$RUNNER_TEMP/issue.json"
          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          printf '%s\n%s\n%s\n' '```json' "$TRIAGE_RESULT" '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_CONTEXT: ${{ needs.triage.outputs.issue-context }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          permissions: |
            contents: write

      - name: "Persist issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git"
          git fetch --quiet origin "refs/heads/$branch"
          git checkout --quiet FETCH_HEAD

          cp "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/triage.json" .
          cp "$RUNNER_TEMP/issue-context-update/README.md" README.md
          git add issue.json triage.json README.md

          if git diff --cached --quiet; then
            echo "The existing issue context is unchanged."
            exit 0
          fi

          git \
            -c user.name="astral-automations-bot[bot]" \
            -c user.email="305554984+astral-automations-bot[bot]@users.noreply.github.com" \
            commit --message "Update issue context"
          git push origin "HEAD:refs/heads/$branch"

          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/%s\n' "$branch" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  reproduce-bug:
    needs: [triage, context]
    if: >-
      needs.triage.outputs.result != '' &&
      (
        fromJSON(needs.triage.outputs.result).type == 'bug' ||
        fromJSON(needs.triage.outputs.result).type == 'question'
      )
    permissions:
      contents: read
      id-token: write
      issues: read
    uses: $/.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-type: ${{ fromJSON(needs.triage.outputs.result).type }}
      runner: ubuntu-latest
    secrets: inherit

  fix-bug:
    needs:
      - triage
      - reproduce-bug
    if: >-
      needs.triage.outputs.result != '' &&
      fromJSON(needs.triage.outputs.result).type == 'bug' &&
      needs.reproduce-bug.outputs.result != '' &&
      fromJSON(needs.reproduce-bug.outputs.result).reproduction == 'reproducible' &&
      needs.reproduce-bug.outputs.pull-request != ''
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
    uses: $/.github/workflows/fix-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-number: ${{ needs.reproduce-bug.outputs.issue-number }}
      reproduction-result: ${{ needs.reproduce-bug.outputs.result }}
      reproduction-thread-artifact-id: ${{ needs.reproduce-bug.outputs.thread-artifact-id }}
      parent-pull-request: ${{ needs.reproduce-bug.outputs.pull-request }}
      parent-head-ref: ${{ needs.reproduce-bug.outputs.head-ref }}
      parent-head-sha: ${{ needs.reproduce-bug.outputs.head-sha }}
      runner: ubuntu-latest
    secrets: inherit
