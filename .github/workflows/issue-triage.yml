# Analyze newly opened issues without modifying them.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string

permissions: {}

jobs:
  triage:
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-number: ${{ steps.issue.outputs.number }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author \
            > .issue-triage-event.json

          issue_number="$(jq --exit-status --raw-output '.number | select(type == "number" and . > 0 and floor == .)' .issue-triage-event.json)"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$(jq -r '.number' .issue-triage-event.json)" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: "agents/codex"
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-issue-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/codex/sessions
          if-no-files-found: warn

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ needs.triage.outputs.issue-number }}
      cancel-in-progress: false
    permissions:
      id-token: write # for the cross-repository issue-context credential broker
      issues: read
    steps:
      - name: "Validate issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json id,number,title,body,author,url \
            > "$RUNNER_TEMP/issue.json"

          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          if ! jq --exit-status '
            type == "object"
            and (keys | sort == ["related", "summary", "type", "type_reason"])
            and (.type | IN("bug", "enhancement", "duplicate", "question"))
            and (.summary | type == "string")
            and (.type_reason | type == "string")
            and (.related | type == "object")
            and (.related | keys | sort == ["items", "search_scope"])
            and (.related.search_scope | type == "string")
            and (.related.items | type == "array")
            and all(.related.items[];
              type == "object"
              and (keys | sort == ["kind", "number", "reason", "state", "title", "url"])
              and (.kind | IN("issue", "pull_request"))
              and (.number | type == "number" and . > 0 and floor == .)
              and (.reason | type == "string")
              and (.state | IN("open", "closed", "merged"))
              and (.title | type == "string")
              and (.url | type == "string")
            )
          ' "$RUNNER_TEMP/triage.json" > /dev/null; then
            echo "The triage result does not match the expected schema." >&2
            exit 1
          fi

          {
            printf 'number=%s\n' "$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
            printf 'node_id=%s\n' "$(jq --raw-output '.id' "$RUNNER_TEMP/issue.json")"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # Linking an upstream issue to a fork branch requires both permissions on one token.
          permissions: |
            contents: write
            issues: write

      - name: "Persist issue context"
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "The issue number must be a positive integer." >&2
            exit 1
          fi

          branch="issue/$ISSUE_NUMBER"
          git check-ref-format "refs/heads/$branch"

          # shellcheck disable=SC2016 # GraphQL variable declarations must remain literal.
          context="$(
            gh api graphql \
              --raw-field query='
                query(
                  $issueId: ID!,
                  $repositoryOwner: String!,
                  $repositoryName: String!,
                  $qualifiedName: String!
                ) {
                  issue: node(id: $issueId) {
                    ... on Issue {
                      linkedBranches(first: 100) {
                        nodes { ref { name repository { id nameWithOwner } } }
                      }
                    }
                  }
                  repository(owner: $repositoryOwner, name: $repositoryName) {
                    id
                    ref(qualifiedName: $qualifiedName) {
                      name
                      target { ... on Commit { oid tree { oid } } }
                    }
                  }
                }
              ' \
              --raw-field issueId="$ISSUE_NODE_ID" \
              --raw-field repositoryOwner=astral-sh \
              --raw-field repositoryName=uv-dev \
              --raw-field qualifiedName="refs/heads/$branch" \
              --jq '.data'
          )"

          repository_id="$(jq --exit-status --raw-output '.repository.id' <<< "$context")"
          head_sha="$(jq --raw-output '.repository.ref.target.oid // empty' <<< "$context")"
          base_tree="$(jq --raw-output '.repository.ref.target.tree.oid // empty' <<< "$context")"
          linked="$(
            jq --raw-output \
              --arg branch "$branch" \
              --arg repository_id "$repository_id" \
              'any(.issue.linkedBranches.nodes[]; .ref != null and .ref.name == $branch and .ref.repository.id == $repository_id)' \
              <<< "$context"
          )"

          if [ -n "$head_sha" ] && [ "$linked" != true ]; then
            echo "The existing uv-dev branch is not linked to the expected issue." >&2
            exit 1
          fi

          if [ -z "$head_sha" ] && [ "$linked" = true ]; then
            echo "The issue links to a context branch that does not exist." >&2
            exit 1
          fi

          tree_sha="$(
            jq --null-input \
              --rawfile issue "$RUNNER_TEMP/issue.json" \
              --rawfile triage "$RUNNER_TEMP/triage.json" \
              --arg base_tree "$base_tree" \
              '
                {
                  tree: [
                    {path: "issue.json", mode: "100644", type: "blob", content: $issue},
                    {path: "triage.json", mode: "100644", type: "blob", content: $triage}
                  ]
                }
                + if $base_tree == "" then {} else {base_tree: $base_tree} end
              ' |
              gh api \
                --method POST \
                repos/astral-sh/uv-dev/git/trees \
                --input - \
                --jq '.sha'
          )"

          if [ "$tree_sha" = "$base_tree" ]; then
            echo "The existing issue context is unchanged."
            exit 0
          fi

          commit_sha="$(
            jq --null-input \
              --arg issue_number "$ISSUE_NUMBER" \
              --arg tree "$tree_sha" \
              --arg parent "$head_sha" \
              '{message: "Update issue context for uv#\($issue_number)", tree: $tree, parents: (if $parent == "" then [] else [$parent] end)}' |
              gh api \
                --method POST \
                repos/astral-sh/uv-dev/git/commits \
                --input - \
                --jq '.sha'
          )"

          if [ -z "$head_sha" ]; then
            # shellcheck disable=SC2016 # GraphQL variable declarations must remain literal.
            linked_branch="$(
              gh api graphql \
                --raw-field query='
                  mutation($issueId: ID!, $repositoryId: ID!, $name: String!, $oid: GitObjectID!) {
                    createLinkedBranch(input: {
                      issueId: $issueId,
                      repositoryId: $repositoryId,
                      name: $name,
                      oid: $oid
                    }) {
                      linkedBranch { ref { name repository { nameWithOwner } } }
                    }
                  }
                ' \
                --raw-field issueId="$ISSUE_NODE_ID" \
                --raw-field repositoryId="$repository_id" \
                --raw-field name="$branch" \
                --raw-field oid="$commit_sha" \
                --jq '.data.createLinkedBranch.linkedBranch.ref'
            )"

            if ! jq --exit-status \
              --arg branch "$branch" \
              '.name == $branch and .repository.nameWithOwner == "astral-sh/uv-dev"' \
              <<< "$linked_branch" > /dev/null; then
              echo "The issue context branch was created in an unexpected repository." >&2
              exit 1
            fi
          else
            jq --null-input --arg sha "$commit_sha" '{sha: $sha, force: false}' |
              gh api \
                --method PATCH \
                "repos/astral-sh/uv-dev/git/refs/heads/$branch" \
                --input - \
                --silent
          fi

          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/%s\n' "$branch" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NODE_ID: ${{ steps.issue.outputs.node_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}

  reproduce-bug:
    needs: triage
    if: needs.triage.outputs.result != '' && fromJSON(needs.triage.outputs.result).type == 'bug'
    permissions:
      contents: read
      id-token: write
      issues: read
    uses: ./.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      runner: ubuntu-latest
    secrets: inherit # zizmor: ignore[secrets-inherit] -- protected environment secrets are needed for reproduction

  report:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Write triage summary"
        run: printf '```json\n%s\n```\n' "$TRIAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
        env:
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}
