name: Rebase labeled pull request

on:
  # `pull_request` does not run for conflicted pull requests. This only dispatches the trusted
  # workflow on `main`; it never checks out or executes pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [labeled]

permissions: {}

jobs:
  dispatch:
    name: "Rebase pull request #${{ github.event.pull_request.number }}"
    if: >-
      (github.repository == 'astral-sh/uv' || github.repository == 'astral-sh/uv-dev') &&
      github.event.label.name == 'bot:rebase' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch pull request rebase
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run pull-request-conflicts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field pull_request="$PULL_REQUEST_NUMBER" \
            --field head_sha="$PULL_REQUEST_HEAD_SHA"

      - name: Remove rebase label
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels/bot%3Arebase" \
            --silent
