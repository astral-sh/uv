# Publish saved Docker images without rebuilding them.
name: "Publish Docker images"

on:
  workflow_call:
    inputs:
      manifest:
        description: "Artifact ID for the saved Docker image manifest"
        required: true
        type: string
      push-dev:
        required: false
        type: boolean
        default: false

env:
  ACTIONS_CACHE_MODE: none

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base-image: ${{ steps.plan.outputs.base-image }}
      extra-images: ${{ steps.plan.outputs.extra-images }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.manifest }}
          merge-multiple: true

      - name: Read image manifest
        id: plan
        run: |
          echo "base-image=$(jq -ce '.base' docker-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "extra-images=$(jq -ce '{include: .extra}' docker-manifest.json)" >> "$GITHUB_OUTPUT"

  publish-extra:
    name: publish ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.extra-images) }}
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      image: ${{ toJson(matrix) }}
      push-dev: ${{ inputs.push-dev }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

  # GHCR orders package versions by the first push of a manifest. Publish the
  # annotated base index after the variants so GHCR shows it first.
  # See astral-sh/uv#7568.
  publish-base:
    name: publish uv
    needs:
      - plan
      - publish-extra
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      image: ${{ needs.plan.outputs.base-image }}
      push-dev: ${{ inputs.push-dev }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
