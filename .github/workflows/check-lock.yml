on:
  workflow_call:

permissions: {}

jobs:
  lock:
    timeout-minutes: 10
    runs-on: ubuntu-slim
    name: "uv lockfiles"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: "Check project lockfile"
        run: uv lock --check
      - name: "Check script lockfiles"
        env:
          UV_PREVIEW_FEATURES: workspace-list-scripts
        run: |
          set -e -o pipefail
          uv workspace list --scripts |
          while IFS= read -r script; do
            uv lock --script "$script" --check
          done
