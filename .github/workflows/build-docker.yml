# Build Docker images and save release candidates in Depot Registry.
#
# Uses Depot for multi-platform builds. Includes both a `uv` base image, which
# contains the `uv` and `uvx` binaries in a scratch image, and common base images
# with uv installed.
#
# On pull requests, CI builds the images when Docker-related files change.
# Images are not saved unless a trusted development-image push is requested.
#
# Releases, including dry-runs, save the images in Depot Registry. The returned
# artifact records their build IDs, digests, tags, and annotations for
# `publish-docker.yml`.
name: "Build Docker images"

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
        default: ""
      push-dev:
        required: false
        type: boolean
        default: false
    outputs:
      manifest:
        description: "Artifact ID for the saved Docker image manifest"
        value: ${{ jobs.docker-manifest.outputs.artifact-id }}
      publish-dev:
        description: "Whether to publish the saved development images"
        value: ${{ inputs.push-dev && jobs.docker-plan.outputs.push == 'true' }}

env:
  ACTIONS_CACHE_MODE: none
  DEPOT_PROJECT_PROD_UV: 7hd4vdzmw5 # prod/uv
  DEPOT_PROJECT_DEV_UV: v094vdzkdt # dev/uv
  DEPOT_PROJECT_DEV_UV_DEV: c3ht4lmvqh # dev/uv-dev
  UV_GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.push-dev && 'uv-dev' || 'uv' }}
  UV_DOCKERHUB_IMAGE: ${{ !inputs.push-dev && 'docker.io/astral/uv' || '' }}
  UV_LOCKED: 1

permissions:
  contents: read

jobs:
  docker-plan:
    name: plan
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      depot-project-id: ${{ steps.plan.outputs.depot-project-id }}
      login: ${{ steps.plan.outputs.login }}
      push: ${{ steps.plan.outputs.push }}
      push-version: ${{ steps.plan.outputs.push-version }}
      save: ${{ steps.plan.outputs.save }}
      tag: ${{ steps.plan.outputs.tag }}
      extra-images: ${{ steps.extra-images.outputs.matrix }}
    steps:
      - name: Plan images
        env:
          DRY_RUN: ${{ inputs.plan == '' || fromJson(inputs.plan).announcement_tag_is_implicit }}
          # Release dry-runs also exercise the Depot Registry handoff.
          RELEASE_BUILD: ${{ inputs.plan != '' }}
          TAG: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_tag }}
          PUSH_DEV: ${{ inputs.push-dev }}
          IS_LOCAL_PR: ${{ github.repository == 'astral-sh/uv' && github.event.pull_request.head.repo.full_name == github.repository }}
          IS_UV_DEV_PR: ${{ github.repository == 'astral-sh/uv-dev' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: plan
        run: |
          # Each repository has its own development cache and saved images.
          # Release plans in `uv`, including dry-runs, use the production project.
          case "$GITHUB_REPOSITORY" in
            astral-sh/uv)
              if [ "$RELEASE_BUILD" == "true" ] && [ "$PUSH_DEV" != "true" ]; then
                depot_project_id="$DEPOT_PROJECT_PROD_UV"
              else
                depot_project_id="$DEPOT_PROJECT_DEV_UV"
              fi
              ;;
            astral-sh/uv-dev) depot_project_id="$DEPOT_PROJECT_DEV_UV_DEV" ;;
            *) echo "No Depot project configured for $GITHUB_REPOSITORY" >&2; exit 1 ;;
          esac

          {
            echo "depot-project-id=$depot_project_id"
            if [ "${PUSH_DEV}" == "true" ] && { [ "${IS_LOCAL_PR}" == "true" ] || [ "${IS_UV_DEV_PR}" == "true" ]; }; then
              echo "login=${IS_LOCAL_PR}"
              echo "push=true"
              echo "push-version=false"
              echo "save=true"
              echo "tag=sha"
            elif [ "${DRY_RUN}" == "false" ]; then
              echo "login=true"
              echo "push=true"
              echo "push-version=true"
              echo "save=true"
              echo "tag=${TAG}"
            else
              echo "login=${IS_LOCAL_PR}"
              echo "push=false"
              echo "push-version=false"
              echo "save=${RELEASE_BUILD}"
              echo "tag=dry-run"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Generate extra image matrix
        id: extra-images
        env:
          LOGIN: ${{ steps.plan.outputs.login }}
        run: |
          # Each entry is: base-image,tag1,tag2,...
          # DHI (Docker Hardened Images) require authentication to pull, so they
          # are excluded when login is unavailable (e.g., PRs from forks).
          images=(
            "alpine:3.23,alpine3.23,alpine"
            "alpine:3.22,alpine3.22"
            "debian:trixie-slim,trixie-slim,debian-slim"
            "buildpack-deps:trixie,trixie,debian"
            "python:3.15-rc-alpine3.23,python3.15-rc-alpine3.23,python3.15-rc-alpine"
            "python:3.14-alpine3.23,python3.14-alpine3.23,python3.14-alpine"
            "python:3.13-alpine3.23,python3.13-alpine3.23,python3.13-alpine"
            "python:3.12-alpine3.23,python3.12-alpine3.23,python3.12-alpine"
            "python:3.11-alpine3.23,python3.11-alpine3.23,python3.11-alpine"
            "python:3.10-alpine3.23,python3.10-alpine3.23,python3.10-alpine"
            "python:3.9-alpine3.22,python3.9-alpine3.22,python3.9-alpine"
            "python:3.15-rc-trixie,python3.15-rc-trixie"
            "python:3.14-trixie,python3.14-trixie"
            "python:3.13-trixie,python3.13-trixie"
            "python:3.12-trixie,python3.12-trixie"
            "python:3.11-trixie,python3.11-trixie"
            "python:3.10-trixie,python3.10-trixie"
            "python:3.9-trixie,python3.9-trixie"
            "python:3.15-rc-slim-trixie,python3.15-rc-trixie-slim"
            "python:3.14-slim-trixie,python3.14-trixie-slim"
            "python:3.13-slim-trixie,python3.13-trixie-slim"
            "python:3.12-slim-trixie,python3.12-trixie-slim"
            "python:3.11-slim-trixie,python3.11-trixie-slim"
            "python:3.10-slim-trixie,python3.10-trixie-slim"
            "python:3.9-slim-trixie,python3.9-trixie-slim"
          )

          if [ "${LOGIN}" == "true" ]; then
            images+=(
              "dhi.io/alpine-base:3.23,alpine3.23-dhi,alpine-dhi"
              "dhi.io/debian-base:trixie-debian13,trixie-dhi,debian-dhi"
              "dhi.io/python:3.14,python3.14-dhi"
              "dhi.io/python:3.13,python3.13-dhi"
              "dhi.io/python:3.12,python3.12-dhi"
              "dhi.io/python:3.11,python3.11-dhi"
              "dhi.io/python:3.10,python3.10-dhi"
            )
          fi

          json=$(printf '%s\n' "${images[@]}" | jq -R . | jq -sc '{"image-mapping": .}')
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  docker-build-base:
    name: build uv
    needs: docker-plan
    env:
      DEPOT_PROJECT_ID: ${{ needs.docker-plan.outputs.depot-project-id }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # for Depot OIDC
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - name: Check tag consistency
        if: ${{ needs.docker-plan.outputs.push-version == 'true' }}
        env:
          TAG: ${{ needs.docker-plan.outputs.tag }}
        run: |
          version=$(grep "version = " pyproject.toml | sed -e 's/version = "\(.*\)"/\1/g')
          if [ "${TAG}" != "${version}" ]; then
            echo "The input tag does not match the version from pyproject.toml:" >&2
            echo "${TAG}" >&2
            echo "${version}" >&2
            exit 1
          fi
          echo "Releasing ${version}"

      - name: Build and save image
        id: build
        uses: astral-sh/github-actions/docker-build@29736b0ef051c49097a9b4adca75e0f3e0c973dd
        with:
          name: uv
          project: ${{ env.DEPOT_PROJECT_ID }}
          images: |
            ${{ env.UV_GHCR_IMAGE }}
            ${{ env.UV_DOCKERHUB_IMAGE }}
          save: ${{ needs.docker-plan.outputs.save }}
          # Set the OCI version label to the release version.
          tags: |
            type=raw,value=dry-run,enable=${{ needs.docker-plan.outputs.push == 'false' }}
            type=pep440,pattern={{ version }},value=${{ needs.docker-plan.outputs.tag }},enable=${{ needs.docker-plan.outputs.push-version == 'true' }}
            type=pep440,pattern={{ major }}.{{ minor }},value=${{ needs.docker-plan.outputs.tag }},enable=${{ needs.docker-plan.outputs.push-version == 'true' }}
            type=sha,enable=${{ inputs.push-dev }}

  docker-build-extra:
    name: build ${{ matrix.image-mapping }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs:
      - docker-plan
      - docker-build-base
    env:
      DEPOT_PROJECT_ID: ${{ needs.docker-plan.outputs.depot-project-id }}
    permissions:
      id-token: write # for Depot OIDC
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.docker-plan.outputs.extra-images) }}
    steps:
      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          registry: dhi.io
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - name: Generate Dockerfile and tags
        id: variant
        uses: astral-sh/github-actions/docker-variant@29736b0ef051c49097a9b4adca75e0f3e0c973dd
        with:
          image-mapping: ${{ matrix.image-mapping }}
          # Unsaved PR builds use the published base image.
          source-image: ${{ needs.docker-plan.outputs.save == 'true' && format('registry.depot.dev/{0}@{1}', env.DEPOT_PROJECT_ID, needs.docker-build-base.outputs.image-digest) || format('{0}:latest', env.UV_GHCR_IMAGE) }}
          binaries: uv uvx
          command: uv
          dockerfile-lines: ENV UV_TOOL_BIN_DIR="/usr/local/bin"
          version: ${{ needs.docker-plan.outputs.tag }}
          push-dev: ${{ inputs.push-dev }}

      - name: Build and save image
        uses: astral-sh/github-actions/docker-build@29736b0ef051c49097a9b4adca75e0f3e0c973dd
        with:
          name: ${{ steps.variant.outputs.name }}
          project: ${{ env.DEPOT_PROJECT_ID }}
          pull-build-id: ${{ needs.docker-plan.outputs.save == 'true' && needs.docker-build-base.outputs.build-id || '' }}
          file: ${{ steps.variant.outputs.file }}
          images: |
            ${{ env.UV_GHCR_IMAGE }}
            ${{ env.UV_DOCKERHUB_IMAGE }}
          tags: ${{ steps.variant.outputs.tags }}
          flavor: latest=false
          save: ${{ needs.docker-plan.outputs.save }}

  docker-manifest:
    name: collect image manifest
    needs:
      - docker-plan
      - docker-build-base
      - docker-build-extra
    if: ${{ needs.docker-plan.outputs.save == 'true' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      artifact-id: ${{ steps.manifest.outputs.artifact-id }}
    steps:
      - uses: astral-sh/github-actions/docker-manifest@29736b0ef051c49097a9b4adca75e0f3e0c973dd
        id: manifest
        with:
          base-name: uv
          image-mappings: ${{ toJson(fromJson(needs.docker-plan.outputs.extra-images).image-mapping) }}
