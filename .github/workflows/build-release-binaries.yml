        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: "Prep README.md"
        run: python scripts/transform_readme.py --target pypi

      # uv
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: musllinux_1_1
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM
          args: --release --locked --out dist --features self-update --compatibility pypi
          before-script-linux: |
            scripts/install-cargo-extensions.sh
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel"
        uses: ./.github/actions/release-smoke-test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          image: alpine:3.12@sha256:c75ac27b49326926b803b9ed43bf088bc220d22556de1bc5f72d742c91398f69
          artifacts: dist
          run: |
            apk add python3 py3-pip
            python3 -m venv .venv
            .venv/bin/pip install --upgrade --require-hashes -r /pip-requirements.txt
            .venv/bin/pip install ${PACKAGE_NAME} --no-index --find-links /dist/ --force-reinstall
            .venv/bin/${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME} --help
            .venv/bin/uvx --help
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels_uv-${{ matrix.target }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          ARCHIVE_NAME=uv-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp target/$TARGET/release/uv $ARCHIVE_NAME/uv
          cp target/$TARGET/release/uvx $ARCHIVE_NAME/uvx
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
        env:
          TARGET: ${{ matrix.target }}
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

      # uv-build
      - name: "Build wheels uv-build"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: musllinux_1_1
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM
          args: --profile minimal-size --locked --out crates/uv-build/dist -m crates/uv-build/Cargo.toml --compatibility pypi
          before-script-linux: |
            scripts/install-cargo-extensions.sh
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel uv-build"
        uses: ./.github/actions/release-smoke-test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          image: alpine:3.12@sha256:c75ac27b49326926b803b9ed43bf088bc220d22556de1bc5f72d742c91398f69
          artifacts: crates/uv-build/dist
          run: |
            apk add python3 py3-pip
            python3 -m venv .venv
            .venv/bin/pip install --upgrade --require-hashes -r /pip-requirements.txt
            .venv/bin/pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME}_build --help
      - name: "Upload wheels uv-build"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels_uv_build-${{ matrix.target }}
          path: crates/uv-build/dist

  musllinux-cross:
    name: ${{ matrix.platform.target }}
    runs-on: depot-ubuntu-24.04-8
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      matrix:
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            test_image: arm64v8/alpine:latest@sha256:65b6d5e8cc3010146b8b28cad29473b67883635fbedc9851f05ac83fb713ebdb
            test_platform: linux/arm64
            maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            test_image: arm32v7/alpine:latest@sha256:8cc6ea3910f429645e27a90f51b73fb499e9136d12f11973ef233db7f4223967
            test_platform: linux/arm/v7
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            test_image: riscv64/alpine:latest@sha256:e7eb5d29759ca6c5622f8940faa8142a9316799aec31291c075a1847a20f28e6
            test_platform: linux/riscv64
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Prep README.md"
        run: python scripts/transform_readme.py --target pypi

      # uv
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_1
          # Tag the musl builds as manylinux 2_17 fallback cause the aarch64 build only support 2_28
          args: --release --locked --out dist --features self-update --compatibility ${{ matrix.platform.arch == 'riscv64' && '2_31' || '2_17'}} --compatibility pypi
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM ${{ matrix.platform.maturin_docker_options }}
          rust-toolchain: ${{ matrix.platform.toolchain || null }}
          before-script-linux: |
            scripts/install-cargo-extensions.sh
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel"
        uses: ./.github/actions/release-smoke-test
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME} --help
            .venv/bin/uvx --help
      - name: "Test wheel (manylinux)"
        uses: ./.github/actions/release-smoke-test
        if: matrix.platform.arch == 'aarch64'
        with:
          image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
          platform: linux/arm64
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME} --help
            uvx --help
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels_uv-${{ matrix.platform.target }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          ARCHIVE_NAME=uv-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp target/$TARGET/$PROFILE/uv $ARCHIVE_NAME/uv
          cp target/$TARGET/$PROFILE/uvx $ARCHIVE_NAME/uvx
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
        env:
          TARGET: ${{ matrix.platform.target }}
          PROFILE: ${{ matrix.platform.arch == 'ppc64le' && 'release-no-lto' || 'release' }}
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256

      # uv-build
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_1
          args: --profile minimal-size --locked ${{ matrix.platform.arch == 'aarch64' && '--compatibility 2_17' || ''}} --out crates/uv-build/dist -m crates/uv-build/Cargo.toml --compatibility pypi
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM ${{ matrix.platform.maturin_docker_options }}
          rust-toolchain: ${{ matrix.platform.toolchain || null }}
          before-script-linux: |
            scripts/install-cargo-extensions.sh
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel"
        uses: ./.github/actions/release-smoke-test
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: crates/uv-build/dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME}_build --help
      - name: "Test wheel (manylinux)"
        uses: ./.github/actions/release-smoke-test
        if: matrix.platform.arch == 'aarch64'
        with:
          image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
          platform: linux/arm64
          artifacts: crates/uv-build/dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME}_build --help
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels_uv_build-${{ matrix.platform.target }}
          path: crates/uv-build/dist

  check-wheels:
    name: "check wheel contents"
    runs-on: ubuntu-slim
    needs:
      - macos-x86_64
      - macos-aarch64
      - windows
      - linux
      - linux-arm
      - linux-s390x
      - linux-powerpc
      - linux-riscv64
      - musllinux
      - musllinux-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels_*-*
          path: wheels
          merge-multiple: true
      - name: "check wheel contents"
        run: uv run --no-project scripts/check_uv_wheel_contents.py wheels/*
