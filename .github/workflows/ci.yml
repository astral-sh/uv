name: Repeat native runtime measurements

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cgu-runtime-repeat-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_CACHE_MODE: none
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  AWS_LC_SYS_USE_SYSTEM: "0"

jobs:
  compare:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: namespace-profile-windows-2022-x86-64-16x32
            python-architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
      - name: Install measurement tools
        run: python -m pip install psutil==7.0.0
      - name: Download measured binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cgu-comparison-${{ matrix.target }}
          run-id: 37685797363
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cgu-comparison
      - name: Repeat runtime measurements
        run: python -u scripts/repeat_codegen_runtime.py
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgu-runtime-repeat-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cgu-comparison/evidence
            ${{ runner.temp }}/cgu-comparison/runtime-repeat/*.json*
          if-no-files-found: warn
