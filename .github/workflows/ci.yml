name: Python bootstrap cache measurement

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  seed:
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        env:
          UV_PYTHON_INSTALL_DIR: ${{ env.DEV_DRIVE }}/uv-python-bootstrap-benchmark
        with:
          version: "0.12.10"
          checksum: "f65744f94072152b1f86ba2aace4d01f1124d9a8ecb235805039e3718c36cac2"
          enable-cache: false

      - name: Install seed interpreters
        run: uv python install
        env:
          UV_CACHE_DIR: ${{ env.DEV_DRIVE }}/uv-python-bootstrap-seed-cache
          UV_PYTHON_CACHE_DIR: ${{ env.DEV_DRIVE }}/uv-python-bootstrap-seed-cache/python

      - name: Save benchmark cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-bootstrap-measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}

  measure:
    needs: seed
    name: "measure ${{ matrix.order }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { order: CDW, first: c-cold, second: d-cold, third: d-warm }
          - { order: CWD, first: c-cold, second: d-warm, third: d-cold }
          - { order: DCW, first: d-cold, second: c-cold, third: d-warm }
          - { order: DWC, first: d-cold, second: d-warm, third: c-cold }
          - { order: WCD, first: d-warm, second: c-cold, third: d-cold }
          - { order: WDC, first: d-warm, second: d-cold, third: c-cold }
    env:
      BENCHMARK_ORDER: ${{ matrix.order }}
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        env:
          UV_PYTHON_INSTALL_DIR: ${{ env.DEV_DRIVE }}/uv-python-bootstrap-benchmark
        with:
          version: "0.12.10"
          checksum: "f65744f94072152b1f86ba2aace4d01f1124d9a8ecb235805039e3718c36cac2"
          enable-cache: false

      - name: "Prepare phase 1: ${{ matrix.first }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage prepare -Mode ${{ matrix.first }} -Phase 1

      - name: "Restore phase 1: ${{ matrix.first }}"
        if: ${{ matrix.first == 'd-warm' }}
        id: restore-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-bootstrap-measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - name: "Measure phase 1: ${{ matrix.first }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage measure -Mode ${{ matrix.first }} -Phase 1 -CacheHit "$env:BENCHMARK_CACHE_HIT"
        env:
          BENCHMARK_CACHE_HIT: ${{ steps.restore-1.outputs.cache-hit }}

      - name: "Prepare phase 2: ${{ matrix.second }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage prepare -Mode ${{ matrix.second }} -Phase 2

      - name: "Restore phase 2: ${{ matrix.second }}"
        if: ${{ matrix.second == 'd-warm' }}
        id: restore-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-bootstrap-measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - name: "Measure phase 2: ${{ matrix.second }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage measure -Mode ${{ matrix.second }} -Phase 2 -CacheHit "$env:BENCHMARK_CACHE_HIT"
        env:
          BENCHMARK_CACHE_HIT: ${{ steps.restore-2.outputs.cache-hit }}

      - name: "Prepare phase 3: ${{ matrix.third }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage prepare -Mode ${{ matrix.third }} -Phase 3

      - name: "Restore phase 3: ${{ matrix.third }}"
        if: ${{ matrix.third == 'd-warm' }}
        id: restore-3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-bootstrap-measure-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true

      - name: "Measure phase 3: ${{ matrix.third }}"
        run: ./scripts/measure-python-bootstrap.ps1 -Stage measure -Mode ${{ matrix.third }} -Phase 3 -CacheHit "$env:BENCHMARK_CACHE_HIT"
        env:
          BENCHMARK_CACHE_HIT: ${{ steps.restore-3.outputs.cache-hit }}

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-bootstrap-${{ matrix.order }}
          path: python-bootstrap-*.json
          if-no-files-found: error
          retention-days: 14
