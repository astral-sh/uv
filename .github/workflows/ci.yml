name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1

jobs:
  detect-vet-workspaces:
    # CI on main is redundant in the security repository.
    if: ${{ github.repository != 'astral-sh/uv-security' || github.ref != 'refs/heads/main' }}
    runs-on: github-ubuntu-24.04-x86_64-2
    outputs:
      workspaces: ${{ steps.detect.outputs.workspaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
      - name: "Detect Cargo Vet workspaces"
        id: detect
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json
        run: uv run --script scripts/cargo-vet-workspaces.py >> "$GITHUB_OUTPUT"

  check-vet:
    name: "Cargo Vet (${{ matrix.workspace }})"
    needs: detect-vet-workspaces
    timeout-minutes: 10
    runs-on: github-ubuntu-24.04-x86_64-4
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(fromJSON(needs.detect-vet-workspaces.outputs.workspaces)[0] != null && needs.detect-vet-workspaces.outputs.workspaces || '["."]') }}
    environment: ${{ fromJSON(needs.detect-vet-workspaces.outputs.workspaces)[0] != null && 'automations' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Skip Cargo Vet"
        if: ${{ fromJSON(needs.detect-vet-workspaces.outputs.workspaces)[0] == null }}
        run: echo "Cargo Vet is not required"
      - name: "Run cargo-vet"
        if: ${{ fromJSON(needs.detect-vet-workspaces.outputs.workspaces)[0] != null }}
        uses: astral-sh/github-actions/cargo-vet@47ef561fb62ac6c7cd971cd36427691e793a3bba
        with:
          workspace: ${{ matrix.workspace }}
          workspaces: ${{ needs.detect-vet-workspaces.outputs.workspaces }}
          uv-version: "0.13.4"
          sts-api-url: ${{ secrets.STS_API_URL }}

  plan:
    needs: check-vet
    uses: $/.github/workflows/plan.yml
