name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  codegen-comparison:
    name: "${{ matrix.mode }} / ${{ matrix.codegen-units }} codegen units"
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [walltime, simulation]
        codegen-units: [16, 1]
    env:
      CARGO_PROFILE_PROFILING_CODEGEN_UNITS: ${{ matrix.codegen-units }}
      BENCHMARK_MODE: ${{ matrix.mode }}
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: false

      - name: "Install requirements"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          uv sync --locked --only-dev
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/workspace.json"
          mkdir -p "$RUNNER_TEMP/codegen-results"
          git rev-parse HEAD > "$RUNNER_TEMP/codegen-results/sha.txt"
          rustc -vV > "$RUNNER_TEMP/codegen-results/rustc.txt"
          lscpu > "$RUNNER_TEMP/codegen-results/cpu.txt"
          cp Cargo.toml "$RUNNER_TEMP/codegen-results/Cargo.toml"
          cp "$RUNNER_TEMP/workspace.json" "$RUNNER_TEMP/codegen-results/workspace.json"

      - name: "Build dependencies and benchmarks"
        run: bash scripts/compare-benchmark-codegen.sh seed

      - name: "Rebuild workspace with warm dependencies, first sample"
        run: bash scripts/compare-benchmark-codegen.sh warm-1

      - name: "Rebuild workspace with warm dependencies, second sample"
        run: bash scripts/compare-benchmark-codegen.sh warm-2

      - name: "Upload measurements"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-${{ matrix.mode }}-${{ matrix.codegen-units }}
          path: ${{ runner.temp }}/codegen-results
          retention-days: 7
