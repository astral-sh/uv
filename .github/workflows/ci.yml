name: Compare release codegen units

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgu-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIONS_CACHE_MODE: none
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  AWS_LC_SYS_USE_SYSTEM: "0"

jobs:
  compare:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: namespace-profile-macos-15
            python-architecture: arm64
          - target: x86_64-pc-windows-msvc
            runner: namespace-profile-windows-2022-x86-64-16x32
            python-architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
      - name: Install Rust and measurement tools
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
          python -m pip install psutil==7.0.0
          scripts/install-cargo-extensions.sh
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '3.02'
          $sha256 = '0DDB40310861EB29F4D649FEB9466779982A2D251C0DB2B9CF0D21CF591171F3'
          $installer = Join-Path $env:RUNNER_TEMP "nasm-${version}-installer-x64.exe"
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-${version}-installer-x64.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $sha256) {
            throw 'NASM installer checksum mismatch'
          }
          $installation = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NASM installation failed: $($installation.ExitCode)"
          }
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Compare builds and runtime
        run: python -u scripts/compare_codegen_units.py
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgu-comparison-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cgu-comparison/evidence
            ${{ runner.temp }}/cgu-comparison/binaries
          if-no-files-found: warn
