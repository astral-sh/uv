name: Coverage

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  test-coverage:
    uses: $/.github/workflows/test.yml
    with:
      save-rust-cache: "false"
      test-macos: "true"
      collect-coverage: true

  combine-coverage:
    needs: test-coverage
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: "Download coverage reports"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*-${{ github.sha }}
          path: target/coverage/artifacts
          merge-multiple: false

      - name: "Generate combined HTML coverage report"
        run: |
          uv run --script scripts/coverage-html-report.py combined --lcov-dir target/coverage/artifacts
          test -f target/coverage/html/combined/index.html

      - name: "Upload combined coverage report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined-${{ github.sha }}
          path: target/coverage/html/combined/
          if-no-files-found: error
          retention-days: 14
