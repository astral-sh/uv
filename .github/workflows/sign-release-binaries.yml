# Rehearse signing uv's macOS arm64 and Windows x86-64 release artifacts.
name: "Sign release binaries"

on:
  workflow_call:

permissions: {}

env:
  # Keep Azure CLI response metadata out of the workflow log.
  AZURE_CORE_OUTPUT: none

jobs:
  prepare:
    name: "prepare signing inputs"
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      unsigned-macos: ${{ steps.macos.outputs.artifact-id }}
      unsigned-windows: ${{ steps.windows.outputs.artifact-id }}
      assembly: ${{ steps.assembly.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Build the wheel replacement tool"
        run: |
          cargo build --locked --package uv-dev --features dev
          cp target/debug/uv-dev .

      - name: "Download unsigned macOS wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels_*-aarch64-apple-darwin
          path: wheels/aarch64-apple-darwin
          merge-multiple: true

      - name: "Download unsigned Windows wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels_*-x86_64-pc-windows-msvc
          path: wheels/x86_64-pc-windows-msvc
          merge-multiple: true

      - name: "Extract executable wheel members"
        shell: bash
        run: |
          set -euo pipefail
          # uv and uv_build keep their executables in .data/scripts.
          for target in aarch64-apple-darwin x86_64-pc-windows-msvc; do
            mkdir -p "unsigned/$target"
            for wheel in wheels/"$target"/*.whl; do
              unzip -j "$wheel" '*.data/scripts/*' -d "unsigned/$target"
            done
          done

      - name: "Upload unsigned macOS executables"
        id: macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/aarch64-apple-darwin/*
          if-no-files-found: error

      - name: "Upload unsigned Windows executables"
        id: windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned/x86_64-pc-windows-msvc/*
          if-no-files-found: error

      - name: "Upload assembly inputs"
        id: assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wheels
            uv-dev
          if-no-files-found: error

  sign-macos:
    name: "sign macos binaries"
    needs: prepare
    if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: "Download unsigned executable wheel members"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.unsigned-macos }}
          path: unsigned
          merge-multiple: true

      - name: "Log in to Azure with GitHub OIDC"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_MACOS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_MACOS }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_MACOS }}

      - name: "Sign executable wheel members through Azure Key Vault"
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ secrets.CODESIGN_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ secrets.CODESIGN_STORAGE_CONTAINER }}
          RCODESIGN_BLOB: ${{ secrets.CODESIGN_RCODESIGN_BLOB }}
          RCODESIGN_SHA256: ${{ secrets.CODESIGN_RCODESIGN_SHA256 }}
          PKCS11_BLOB: ${{ secrets.CODESIGN_PKCS11_BLOB }}
          PKCS11_SHA256: ${{ secrets.CODESIGN_PKCS11_SHA256 }}
          AZURE_CREDENTIAL_KIND: azurecli
          AZURE_KEYVAULT_NAME: ${{ secrets.CODESIGN_KEY_VAULT }}
          AZURE_KEYVAULT_KEY_VERSION: ${{ secrets.CODESIGN_KEY_VERSION }}
          KEY_NAME: ${{ secrets.CODESIGN_KEY_NAME }}
          CERTIFICATE_SHA256: ${{ secrets.CODESIGN_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          for variable in STORAGE_ACCOUNT STORAGE_CONTAINER RCODESIGN_BLOB RCODESIGN_SHA256 \
            PKCS11_BLOB PKCS11_SHA256 AZURE_KEYVAULT_NAME AZURE_KEYVAULT_KEY_VERSION \
            KEY_NAME CERTIFICATE_SHA256; do
            test -n "${!variable}" || { echo "Missing signing configuration: $variable" >&2; exit 1; }
          done

          # Download a signing tool from Azure Blob Storage.
          download_blob() {
            if ! az storage blob download --auth-mode login --only-show-errors \
              --account-name "$STORAGE_ACCOUNT" --container-name "$STORAGE_CONTAINER" \
              --name "$1" --file "$2" >/dev/null 2>&1; then
              echo "Could not download a signing tool." >&2
              exit 1
            fi
          }
          download_blob "$RCODESIGN_BLOB" "$RUNNER_TEMP/rcodesign"
          download_blob "$PKCS11_BLOB" "$RUNNER_TEMP/libakv_pkcs11.so"
          test "$(sha256sum "$RUNNER_TEMP/rcodesign" | cut -d ' ' -f 1)" = "$RCODESIGN_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/libakv_pkcs11.so" | cut -d ' ' -f 1)" = "$PKCS11_SHA256"
          chmod +x "$RUNNER_TEMP/rcodesign"

          if ! az keyvault certificate download --only-show-errors \
            --vault-name "$AZURE_KEYVAULT_NAME" --name "$KEY_NAME" \
            --version "$AZURE_KEYVAULT_KEY_VERSION" --encoding PEM \
            --file "$RUNNER_TEMP/signing-cert.pem" >/dev/null 2>&1; then
            echo "Could not download the public signing certificate." >&2
            exit 1
          fi
          certificate_sha256=$(openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -outform DER | sha256sum | cut -d ' ' -f 1)
          test "$certificate_sha256" = "$CERTIFICATE_SHA256"

          mkdir signed
          # Carry the public certificate for native identity verification.
          cp "$RUNNER_TEMP/signing-cert.pem" signed/certificate.pem
          for binary in uv uvx uv-build; do
            if ! "$RUNNER_TEMP/rcodesign" sign --config-file /dev/null \
              --pkcs11-library "$RUNNER_TEMP/libakv_pkcs11.so" \
              --pkcs11-certificate-file "$RUNNER_TEMP/signing-cert.pem" \
              --pkcs11-key-label "$KEY_NAME" --code-signature-flags runtime \
              --timestamp-url http://timestamp.apple.com/ts \
              "unsigned/$binary" "signed/$binary" >/dev/null 2>&1; then
              echo "Remote signing failed: $binary" >&2
              exit 1
            fi
          done

      - name: "Upload signed executable wheel members"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed/*
          if-no-files-found: error

  sign-windows:
    name: "sign windows binaries"
    needs: prepare
    if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    environment: release
    permissions:
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: "Download unsigned executable wheel members"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.unsigned-windows }}
          path: unsigned
          merge-multiple: true

      - name: "Log in to Azure with GitHub OIDC"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WINDOWS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_WINDOWS }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_WINDOWS }}

      - name: "Copy executable wheel members for signing"
        shell: pwsh
        run: |
          New-Item signed -ItemType Directory | Out-Null
          foreach ($binary in @('uv.exe', 'uvx.exe', 'uvw.exe', 'uv-build.exe')) {
            Copy-Item (Join-Path unsigned $binary) (Join-Path signed $binary)
          }

      - name: "Sign executable wheel members with Azure Artifact Signing"
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.CODESIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.CODESIGN_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}/signed/uv.exe
            ${{ github.workspace }}/signed/uvx.exe
            ${{ github.workspace }}/signed/uvw.exe
            ${{ github.workspace }}/signed/uv-build.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          cache-dependencies: false
          trace: false

      - name: "Verify signed executable identities"
        shell: pwsh
        env:
          CERTIFICATE_SUBJECT: ${{ secrets.CODESIGN_CERTIFICATE_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERTIFICATE_SUBJECT) { throw 'Missing signing certificate subject' }
          foreach ($binary in @('uv.exe', 'uvx.exe', 'uvw.exe', 'uv-build.exe')) {
            $path = Join-Path signed $binary
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Subject -ne $env:CERTIFICATE_SUBJECT) {
              throw "Expected a timestamped signature from the configured publisher: $binary"
            }
          }

      - name: "Upload signed executable wheel members"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed/*
          if-no-files-found: error

  assemble:
    name: "assemble signed release artifacts"
    needs: [prepare, sign-macos, sign-windows]
    runs-on: depot-ubuntu-24.04-4
    outputs:
      macos: ${{ steps.macos.outputs.artifact-id }}
      windows: ${{ steps.windows.outputs.artifact-id }}
    steps:
      - name: "Download assembly inputs"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.assembly }}
          merge-multiple: true

      - name: "Download signed macOS executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact }}
          path: signed/aarch64-apple-darwin
          merge-multiple: true

      - name: "Download signed Windows executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact }}
          path: signed/x86_64-pc-windows-msvc
          merge-multiple: true

      - name: "Replace executable wheel members"
        shell: bash
        run: |
          set -euo pipefail
          # Artifact uploads do not preserve executable permissions.
          chmod +x uv-dev
          for target in aarch64-apple-darwin x86_64-pc-windows-msvc; do
            mkdir -p "dist/$target/wheels"
            for wheel in wheels/"$target"/*.whl; do
              replacements=()
              while IFS= read -r member; do
                replacements+=(--replace "$member=signed/$target/${member##*/}")
              done < <(unzip -Z1 "$wheel" '*.data/scripts/*')
              ./uv-dev wheel-replace --input "$wheel" \
                --output "dist/$target/wheels/${wheel##*/}" "${replacements[@]}"
            done
          done

      - name: "Archive the signed executables"
        shell: bash
        run: |
          set -euo pipefail
          # Match the release archive layouts; uv-build is only distributed in wheels.
          mkdir uv-aarch64-apple-darwin
          cp signed/aarch64-apple-darwin/{uv,uvx} uv-aarch64-apple-darwin/
          chmod 755 uv-aarch64-apple-darwin/{uv,uvx}
          tar czf dist/aarch64-apple-darwin/uv-aarch64-apple-darwin.tar.gz uv-aarch64-apple-darwin
          zip -j dist/x86_64-pc-windows-msvc/uv-x86_64-pc-windows-msvc.zip \
            signed/x86_64-pc-windows-msvc/{uv.exe,uvx.exe,uvw.exe}
          (cd dist/aarch64-apple-darwin && sha256sum uv-aarch64-apple-darwin.tar.gz > uv-aarch64-apple-darwin.tar.gz.sha256)
          (cd dist/x86_64-pc-windows-msvc && sha256sum uv-x86_64-pc-windows-msvc.zip > uv-x86_64-pc-windows-msvc.zip.sha256)

      - name: "Upload signed macOS artifacts"
        id: macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/aarch64-apple-darwin
          if-no-files-found: error

      - name: "Upload signed Windows artifacts"
        id: windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/x86_64-pc-windows-msvc
          if-no-files-found: error

  verify-macos:
    name: "verify signed macos artifacts"
    needs: [sign-macos, assemble]
    runs-on: namespace-profile-macos-15
    steps:
      - name: "Download signed executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Download completed artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.macos }}
          path: dist
          merge-multiple: true

      - name: "Verify packaged executables and signatures"
        shell: bash
        run: |
          set -euo pipefail
          mkdir wheel-contents
          for wheel in dist/wheels/*.whl; do
            unzip -j "$wheel" '*.data/scripts/*' -d wheel-contents
          done
          tar xzf dist/uv-aarch64-apple-darwin.tar.gz
          for binary in uv uvx; do
            cmp "signed/$binary" "uv-aarch64-apple-darwin/$binary"
          done
          expected_certificate=$(openssl x509 -in signed/certificate.pem -outform DER | shasum -a 256 | cut -d ' ' -f 1)
          for binary in uv uvx uv-build; do
            binary_path="wheel-contents/$binary"
            cmp "signed/$binary" "$binary_path"
            codesign --verify --strict -R 'anchor apple generic' "$binary_path"
            codesign --display --verbose=4 "$binary_path" 2>&1 | grep -q '^Timestamp='
            codesign --display --extract-certificates="$RUNNER_TEMP/$binary-cert-" "$binary_path"
            test "$(shasum -a 256 "$RUNNER_TEMP/$binary-cert-0" | cut -d ' ' -f 1)" = "$expected_certificate"
          done

      - name: "Install and run the signed wheels"
        run: |
          python3 -m venv wheel-test
          wheel-test/bin/python -m pip install --no-index --no-deps dist/wheels/*.whl
          for binary in uv uvx uv-build; do
            "wheel-test/bin/$binary" --version
          done

  verify-windows:
    name: "verify signed windows artifacts"
    needs: [sign-windows, assemble]
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Download signed executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Download completed artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.windows }}
          path: dist
          merge-multiple: true

      - name: "Verify packaged executables and signatures"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($wheel in Get-ChildItem dist/wheels/*.whl) {
            python -m zipfile -e $wheel.FullName wheel-contents
            if ($LASTEXITCODE -ne 0) { throw "Wheel extraction failed: $wheel" }
          }
          Expand-Archive dist/uv-x86_64-pc-windows-msvc.zip archive-contents
          foreach ($binary in @('uv.exe', 'uvx.exe', 'uvw.exe')) {
            if ((Get-FileHash "signed/$binary").Hash -ne (Get-FileHash "archive-contents/$binary").Hash) {
              throw "Archive executable differs from signing output: $binary"
            }
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found in Windows SDK' }
          foreach ($binary in @('uv.exe', 'uvx.exe', 'uvw.exe', 'uv-build.exe')) {
            $binaryPath = (Get-Item "wheel-contents/*.data/scripts/$binary").FullName
            if ((Get-FileHash "signed/$binary").Hash -ne (Get-FileHash $binaryPath).Hash) {
              throw "Wheel executable differs from signing output: $binary"
            }
            $signature = Get-AuthenticodeSignature $binaryPath
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Expected a publicly trusted, timestamped signature: $binary"
            }
            & $signtool verify /pa /all /v $binaryPath
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $binary" }
          }

      - name: "Install and run the signed wheels"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv wheel-test
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }
          $wheels = Get-ChildItem dist/wheels/*.whl
          & wheel-test/Scripts/python.exe -m pip install --no-index --no-deps $wheels.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Signed wheel installation failed' }
          foreach ($binary in @('uv.exe', 'uvx.exe', 'uvw.exe', 'uv-build.exe')) {
            $binaryPath = Join-Path wheel-test/Scripts $binary
            $process = Start-Process -FilePath $binaryPath -ArgumentList '--version' -NoNewWindow -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Signed executable failed: $binary" }
          }
