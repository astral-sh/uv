# Sign and verify uv's macOS and Windows wheels and GitHub release archives.
name: "Sign release binaries"

on:
  workflow_call:
    inputs:
      plan:
        description: "The cargo-dist release plan"
        required: true
        type: string
    outputs:
      uv-wheels:
        description: "Artifact ID for all uv release wheels"
        value: ${{ jobs.assemble.outputs.uv-wheels }}
      uv-build-wheels:
        description: "Artifact ID for all uv_build release wheels"
        value: ${{ jobs.assemble.outputs.uv-build-wheels }}
      github-archives:
        description: "Artifact ID for all GitHub release archives and checksums"
        value: ${{ jobs.assemble.outputs.github-archives }}
      uv-sdist:
        description: "Artifact ID for the uv source distribution"
        value: ${{ jobs.assemble.outputs.uv-sdist }}
      uv-build-sdist:
        description: "Artifact ID for the uv_build source distribution"
        value: ${{ jobs.assemble.outputs.uv-build-sdist }}

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: "1"
  # Keep Azure CLI response metadata out of the workflow log.
  AZURE_CORE_OUTPUT: none

jobs:
  prepare:
    name: "prepare signing inputs"
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      artifacts: ${{ steps.targets.outputs.artifacts }}
      macos: ${{ steps.targets.outputs.macos }}
      windows: ${{ steps.targets.outputs.windows }}
      unsigned-macos: ${{ steps.macos.outputs.artifact-id }}
      unsigned-windows: ${{ steps.windows.outputs.artifact-id }}
      assembly: ${{ steps.assembly.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false

      - name: "Plan signed release targets"
        id: targets
        run: uv run scripts/plan-release-signing.py >> "$GITHUB_OUTPUT"

      - name: "Download built wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*
          path: wheel-artifacts

      - name: "Download built GitHub release archives"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-github-archives-*
          path: github-archives
          merge-multiple: true

      - name: "Download uv source distribution"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-sdist-uv
          path: sdists/uv

      - name: "Download uv_build source distribution"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-sdist-uv_build
          path: sdists/uv_build

      - name: "Collect built release wheels"
        shell: bash
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          shopt -s failglob
          while read -r target; do
            mkdir -p "wheels/$target"
            cp wheel-artifacts/"build-wheels-uv-$target"/*.whl "wheels/$target/"
            cp wheel-artifacts/"build-wheels-uv_build-$target"/*.whl "wheels/$target/"
          done < <(jq -r '.[]' <<< "$TARGETS")

      - name: "Prepare release signing inputs"
        uses: astral-sh/github-actions/prepare-release-signing@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          targets: ${{ steps.targets.outputs.artifacts }}
          output-directory: prepared

      - name: "Upload unsigned macOS executables"
        id: macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-binaries-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/unsigned/macos
          if-no-files-found: error

      - name: "Upload unsigned Windows executables"
        id: windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-binaries-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/unsigned/windows
          if-no-files-found: error

      - name: "Upload assembly inputs"
        id: assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-assembly-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wheels
            sdists
            github-archives
          if-no-files-found: error

  sign-macos:
    name: "sign and notarize macos binaries"
    needs: prepare
    if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: "Download unsigned executable wheel members"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.unsigned-macos }}
          path: unsigned
          merge-multiple: true

      - name: "Sign and notarize macOS executables"
        uses: astral-sh/github-actions/sign-macos@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          unsigned-directory: ${{ github.workspace }}/unsigned
          signed-directory: ${{ github.workspace }}/signed
          azure-client-id: ${{ secrets.CODESIGN_AZURE_CLIENT_ID_MACOS }}
          azure-tenant-id: ${{ secrets.CODESIGN_AZURE_TENANT_ID_MACOS }}
          azure-subscription-id: ${{ secrets.CODESIGN_AZURE_SUBSCRIPTION_ID_MACOS }}
          storage-account: ${{ secrets.CODESIGN_STORAGE_ACCOUNT }}
          storage-container: ${{ secrets.CODESIGN_STORAGE_CONTAINER }}
          component-rcodesign-blob: ${{ secrets.CODESIGN_COMPONENT_RCODESIGN_BLOB }}
          component-rcodesign-sha256: ${{ secrets.CODESIGN_COMPONENT_RCODESIGN_SHA256 }}
          component-pkcs11-blob: ${{ secrets.CODESIGN_COMPONENT_PKCS11_BLOB }}
          component-pkcs11-sha256: ${{ secrets.CODESIGN_COMPONENT_PKCS11_SHA256 }}
          azure-keyvault-name: ${{ secrets.CODESIGN_AZURE_KEYVAULT_NAME }}
          azure-keyvault-key-version: ${{ secrets.CODESIGN_AZURE_KEYVAULT_KEY_VERSION }}
          key-name: ${{ secrets.CODESIGN_KEY_NAME }}
          certificate-sha256: ${{ secrets.CODESIGN_CERTIFICATE_SHA256 }}
          apple-notarization-akv-key-name: ${{ secrets.CODESIGN_APPLE_NOTARIZATION_AKV_KEY_NAME }}

      - name: "Upload signed executable wheel members"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-binaries-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
          if-no-files-found: error

  sign-windows:
    name: "sign windows binaries"
    needs: prepare
    if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2025
    environment: release
    permissions:
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: "Download unsigned executable wheel members"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.unsigned-windows }}
          path: unsigned
          merge-multiple: true

      - name: "Sign Windows executables"
        uses: astral-sh/github-actions/sign-windows@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          unsigned-directory: ${{ github.workspace }}/unsigned
          signed-directory: ${{ github.workspace }}/signed
          azure-client-id: ${{ secrets.CODESIGN_AZURE_CLIENT_ID_WINDOWS }}
          azure-tenant-id: ${{ secrets.CODESIGN_AZURE_TENANT_ID_WINDOWS }}
          azure-subscription-id: ${{ secrets.CODESIGN_AZURE_SUBSCRIPTION_ID_WINDOWS }}
          endpoint: ${{ secrets.CODESIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.CODESIGN_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.CODESIGN_CERTIFICATE_PROFILE_NAME }}
          certificate-subject: ${{ secrets.CODESIGN_CERTIFICATE_SUBJECT }}

      - name: "Upload signed executable wheel members"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-binaries-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed
          if-no-files-found: error

  assemble:
    name: "assemble signed release artifacts"
    needs: [prepare, sign-macos, sign-windows]
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      macos-wheels: ${{ steps.macos-wheels.outputs.artifact-id }}
      windows-wheels: ${{ steps.windows-wheels.outputs.artifact-id }}
      uv-wheels: ${{ steps.uv-wheels.outputs.artifact-id }}
      uv-build-wheels: ${{ steps.uv-build-wheels.outputs.artifact-id }}
      github-archives: ${{ steps.github-archives.outputs.artifact-id }}
      uv-sdist: ${{ steps.uv-sdist.outputs.artifact-id }}
      uv-build-sdist: ${{ steps.uv-build-sdist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download assembly inputs"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.assembly }}
          merge-multiple: true

      - name: "Download signed macOS executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Download signed Windows executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Assemble signed release artifacts"
        uses: astral-sh/github-actions/assemble-signed-release@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          targets: ${{ needs.prepare.outputs.artifacts }}
          # The complete release inputs retain the originals checked during preparation.
          prepared-directory: .
          signed-directory: signed
          output-directory: signed-artifacts

      - name: "Assemble complete release distributions"
        env:
          RELEASE_PLAN: ${{ inputs.plan }}
          RELEASE_TARGETS: ${{ needs.prepare.outputs.targets }}
          MACOS_TARGETS: ${{ needs.prepare.outputs.macos }}
          WINDOWS_TARGETS: ${{ needs.prepare.outputs.windows }}
        run: |
          uv run scripts/assemble-release-artifacts.py . signed-artifacts/wheels signed-artifacts/github-archives release-artifacts
          uv run scripts/check_uv_wheel_contents.py release-artifacts/wheels/uv/*.whl release-artifacts/wheels/uv_build/*.whl

      - name: "Upload signed macOS wheels"
        id: macos-wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-wheels-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-artifacts/wheels/macos
          if-no-files-found: error

      - name: "Upload signed Windows wheels"
        id: windows-wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-wheels-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-artifacts/wheels/windows
          if-no-files-found: error

      - name: "Upload uv release wheels"
        id: uv-wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-uv-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/wheels/uv
          if-no-files-found: error

      - name: "Upload uv_build release wheels"
        id: uv-build-wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-uv_build-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/wheels/uv_build
          if-no-files-found: error

      - name: "Upload GitHub release archives"
        id: github-archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-github-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/github-archives/*
          if-no-files-found: error

      - name: "Upload uv source distribution"
        id: uv-sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist-uv-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/sdists/uv
          if-no-files-found: error

      - name: "Upload uv_build source distribution"
        id: uv-build-sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist-uv_build-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/sdists/uv_build
          if-no-files-found: error

  verify-macos:
    name: "verify signed ${{ matrix.platform.target }} artifacts"
    needs: [prepare, sign-macos, assemble]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.13"
          architecture: ${{ matrix.platform.python-architecture }}

      - name: "Download signed executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Download signed wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.macos-wheels }}
          path: wheels
          merge-multiple: true

      - name: "Download signed GitHub release archives"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.github-archives }}
          path: github-archives
          merge-multiple: true

      - name: "Verify signed release artifacts"
        uses: astral-sh/github-actions/verify-release@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          target: ${{ toJSON(matrix.platform) }}
          signed-directory: signed/${{ matrix.platform.target }}
          wheels-directory: wheels/${{ matrix.platform.target }}
          github-archives-directory: github-archives

      - name: "Install and run the signed wheels"
        run: ./scripts/test-release-wheels-macos.sh "./wheels/$TARGET"

  verify-windows:
    name: "verify signed ${{ matrix.platform.target }} artifacts"
    needs: [prepare, sign-windows, assemble]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.windows) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.13"
          architecture: ${{ matrix.platform.python-architecture }}

      - name: "Download signed executables"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact }}
          path: signed
          merge-multiple: true

      - name: "Download signed wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.windows-wheels }}
          path: wheels
          merge-multiple: true

      - name: "Download signed GitHub release archives"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.github-archives }}
          path: github-archives
          merge-multiple: true

      - name: "Verify signed release artifacts"
        uses: astral-sh/github-actions/verify-release@502e7ea5960936cda9610b8dac3182c07a335500 # shared release signing actions
        with:
          target: ${{ toJSON(matrix.platform) }}
          signed-directory: signed/${{ matrix.platform.target }}
          wheels-directory: wheels/${{ matrix.platform.target }}
          github-archives-directory: github-archives

      - name: "Install and run the signed wheels"
        shell: pwsh
        run: ./scripts/test-release-wheels-windows.ps1 "./wheels/$env:TARGET"
