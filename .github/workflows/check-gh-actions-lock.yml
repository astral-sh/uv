# Adapted from:
# https://github.com/github/gh-actions-lock/blob/main/.github/workflows/verify-lockfile.yml

name: verify-lockfile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify
