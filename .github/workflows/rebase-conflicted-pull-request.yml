name: Rebase conflicted pull request

on:
  workflow_call:
    inputs:
      number:
        required: true
        type: number
      base-ref:
        required: true
        type: string
      base-previous-sha:
        required: false
        type: string
        default: ""
      head-ref:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      head-repository:
        required: true
        type: string

permissions: {}

env:
  AUTOMATIONS_BOT_ID: "305554984"
  UV_DEV_REPOSITORY_ID: "1302176231"

jobs:
  rebase:
    name: "Rebase pull request #${{ inputs.number }}"
    runs-on: depot-ubuntu-24.04-4
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      clean: ${{ steps.git-rebase.outputs.clean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: v1-rust-workspace
          cache-workspace-crates: "true"
          save-if: false

      - name: Prepare Rust dependencies
        run: cargo fetch --locked

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest

      - name: Prepare pull request branch
        id: prepare
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
          HEAD_REF: ${{ inputs.head-ref }}
          HEAD_SHA: ${{ inputs.head-sha }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp agents/codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
          cp agents/prompts/rebase-pull-request.md "$RUNNER_TEMP/rebase-pull-request.md"

          git fetch --no-tags "https://github.com/$HEAD_REPOSITORY.git" "refs/heads/$HEAD_REF"
          current_head=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "The pull request head changed; refusing to rebase a stale revision." >&2
            exit 1
          fi

          if [ -n "$BASE_PREVIOUS_SHA" ] && { ! [[ "$BASE_PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE_PREVIOUS_SHA" "$HEAD_SHA"; }; then
            echo "The stacked pull request does not contain its previous base; refusing to rebase it." >&2
            exit 1
          fi

          git checkout --detach "$HEAD_SHA"
          git config user.name "astral-automations-bot[bot]"
          git config user.email "305554984+astral-automations-bot[bot]@users.noreply.github.com"
          base_sha=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Rebase without conflict resolution
        id: git-rebase
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
          GIT_EDITOR: "true"
        run: |
          rebase_args=("$BASE_SHA")
          if [ -n "$BASE_PREVIOUS_SHA" ]; then
            rebase_args=(--onto "$BASE_SHA" "$BASE_PREVIOUS_SHA")
          fi

          if git -c core.hooksPath=/dev/null rebase "${rebase_args[@]}"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          elif { [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; } && [ -n "$(git ls-files --unmerged)" ]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "Git failed without leaving merge conflicts; refusing model recovery." >&2
            exit 1
          fi

      - name: Enable Linux user namespaces for bubblewrap
        if: steps.git-rebase.outputs.clean == 'false'
        run: |
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve rebase conflicts
        if: steps.git-rebase.outputs.clean == 'false'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
          TMPDIR: ${{ runner.temp }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          model: gpt-5.6-sol
          effort: high
          codex-home: "${{ runner.temp }}/codex-home"
          permission-profile: "pull-request-rebase"
          safety-strategy: drop-sudo
          allow-bot-users: "astral-automations-bot[bot]"
          prompt-file: "${{ runner.temp }}/rebase-pull-request.md"

      - name: Verify rebased pull request
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "The rebase is still in progress; refusing to push." >&2
            exit 1
          fi

          git diff --check "refs/remotes/origin/$BASE_REF...HEAD"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The worktree is not clean after the rebase; refusing to push." >&2
            exit 1
          fi

          git bundle create "$RUNNER_TEMP/rebased.bundle" "refs/remotes/origin/$BASE_REF..HEAD"

      - name: Upload rebased pull request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebased-pull-request-${{ inputs.number }}-${{ inputs.head-sha }}
          path: ${{ runner.temp }}/rebased.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  push:
    name: "Push rebased pull request #${{ inputs.number }}"
    needs: rebase
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download rebased pull request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebased-pull-request-${{ inputs.number }}-${{ inputs.head-sha }}
          path: ${{ runner.temp }}/rebased-pull-request

      - name: Import rebased pull request
        id: import
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BASE_SHA: ${{ needs.rebase.outputs.base_sha }}
          BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
          CLEAN_REBASE: ${{ needs.rebase.outputs.clean }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          HEAD_REF: ${{ inputs.head-ref }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.number }}
        run: |
          current_base_sha=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
          if [ "$current_base_sha" != "$BASE_SHA" ]; then
            echo "The pull request base changed from $BASE_SHA to $current_base_sha; skipping the stale rebase."
            exit 0
          fi

          bundle="$RUNNER_TEMP/rebased-pull-request/rebased.bundle"
          git bundle verify "$bundle"
          git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" HEAD
          rebased_head=$(git rev-parse 'FETCH_HEAD^{commit}')

          if ! git merge-base --is-ancestor "refs/remotes/origin/$BASE_REF" "$rebased_head"; then
            echo "The rebased pull request does not contain its base; refusing to push." >&2
            exit 1
          fi

          echo "head_sha=$rebased_head" >> "$GITHUB_OUTPUT"

          if [ "$CLEAN_REBASE" = true ] && [ -n "$BASE_PREVIOUS_SHA" ] && [ "$GITHUB_REPOSITORY" = astral-sh/uv-dev ] && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
            if ! jq --exit-status \
              --argjson repository_id "$UV_DEV_REPOSITORY_ID" \
              --arg head_ref "$HEAD_REF" --arg head_sha "$HEAD_SHA" --arg base_ref "$BASE_REF" --arg base_sha "$BASE_SHA" \
              '.state == "open" and .draft and .head.repo.id == $repository_id and .base.repo.id == $repository_id and .head.ref == $head_ref and .head.sha == $head_sha and .base.ref == $base_ref and .base.sha == $base_sha' \
              <<< "$pull_request" > /dev/null; then
              exit 0
            fi
            approval_id=$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/events" --paginate --slurp |
                jq --raw-output '[.[][] | select(.event == "ready_for_review" and .actor.type == "User") | .id | tostring] | last // empty'
            )
            comments=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --paginate --slurp)
            recovery=$(jq --compact-output \
              --argjson bot_id "$AUTOMATIONS_BOT_ID" --arg approval_id "$approval_id" \
              --arg head_ref "$HEAD_REF" --arg head_sha "$HEAD_SHA" --arg base_previous_sha "$BASE_PREVIOUS_SHA" \
              --arg base_ref "$BASE_REF" '
                [.[][] |
                  select(.user.id == $bot_id and .performed_via_github_app.slug == "astral-automations-bot") | . as $comment |
                  .body | split("<!-- uv-promotion-rebase-request:")[1]? | select(type == "string") | split(" -->")[0] | fromjson? |
                  select($approval_id != "" and .approval_id == $approval_id and .head_ref == $head_ref and .head_sha == $head_sha and .base_previous_sha == $base_previous_sha and .base_ref == $base_ref) |
                  . + {request_id: ($comment.id | tostring)}] | last // empty
              ' <<< "$comments")
            if [ -n "$recovery" ]; then
              approved_base=$(jq --raw-output '.base_sha' <<< "$recovery")
              if [[ "$approved_base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$approved_base" "$BASE_SHA"; then
                echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Get pull request head token
        id: token
        if: steps.import.outputs.head_sha != ''
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ inputs.head-repository }}
          # `workflows: write` is required when a rebased pull request modifies workflow files.
          permissions: |
            contents: write
            workflows: write

      - name: Push rebased pull request
        id: push
        if: steps.import.outputs.head_sha != ''
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REF: ${{ inputs.head-ref }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          REBASED_HEAD: ${{ steps.import.outputs.head_sha }}
        run: |
          git -c core.hooksPath=/dev/null push \
            --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
            "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPOSITORY}.git" \
            "${REBASED_HEAD}:refs/heads/$HEAD_REF"

      - name: Get clean rebase promotion token
        id: promotion-token
        if: steps.push.outcome == 'success' && steps.import.outputs.recovery != ''
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          permissions: |
            pull_requests: write

      - name: Resume cleanly rebased promotion
        id: resume
        if: steps.promotion-token.outcome == 'success'
        env:
          BASE_SHA: ${{ needs.rebase.outputs.base_sha }}
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.number }}
          REBASED_HEAD: ${{ steps.import.outputs.head_sha }}
          RECOVERY: ${{ steps.import.outputs.recovery }}
        run: |
          pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          approval_id=$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/events" --paginate --slurp |
              jq --raw-output '[.[][] | select(.event == "ready_for_review" and .actor.type == "User") | .id | tostring] | last // empty'
          )
          if ! jq --exit-status \
            --argjson recovery "$RECOVERY" --arg approval_id "$approval_id" --arg head_sha "$REBASED_HEAD" --arg base_sha "$BASE_SHA" \
            --argjson repository_id "$UV_DEV_REPOSITORY_ID" \
            '.state == "open" and .draft and .head.repo.id == $repository_id and .base.repo.id == $repository_id and .head.ref == $recovery.head_ref and .head.sha == $head_sha and .base.ref == $recovery.base_ref and .base.sha == $base_sha and $approval_id == $recovery.approval_id' \
            <<< "$pull_request" > /dev/null; then
            echo "The rebase approval was superseded; leaving the pull request unchanged."
            exit 0
          fi

          request_id=$(jq --raw-output '.request_id' <<< "$RECOVERY")
          request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues/comments/$request_id")
          if ! jq --exit-status --argjson recovery "$RECOVERY" --argjson bot_id "$AUTOMATIONS_BOT_ID" '
            .user.id == $bot_id and .performed_via_github_app.slug == "astral-automations-bot" and
            (.body | split("<!-- uv-promotion-rebase-request:")[1]? | select(type == "string") | split(" -->")[0] | fromjson?) == ($recovery | del(.request_id))
          ' <<< "$request" > /dev/null; then
            echo "The rebase approval record changed; refusing to resume promotion." >&2
            exit 1
          fi

          receipt=$(jq --compact-output --arg rebased_head_sha "$REBASED_HEAD" --arg rebased_base_sha "$BASE_SHA" '. + {rebased_head_sha: $rebased_head_sha, rebased_base_sha: $rebased_base_sha}' <<< "$RECOVERY")
          printf -v comment "Rebased the approved changes without conflicts or model edits. Resuming promotion at \`%s\`. <!-- uv-promotion-clean-rebase:%s -->" "$REBASED_HEAD" "$receipt"
          gh pr comment "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$comment"
          gh pr ready "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY"
