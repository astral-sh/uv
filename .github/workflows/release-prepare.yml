# Bump the uv version and create a pull request.
name: "Prepare release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to set (overrides detection)"
        required: false
        type: string

permissions: {}

env:
  UV_LOCKED: 1
  UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json

jobs:
  prepare-release:
    if: github.repository == 'astral-sh/uv'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write # for the credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: "Get uv token"
        id: token
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            contents: write
            pull_requests: write

      - name: "Configure Git"
        run: |
          git config user.name "astral-automations-bot[bot]"
          git config user.email "305554984+astral-automations-bot[bot]@users.noreply.github.com"

      - name: "Bump version"
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ./scripts/release.sh --version "$INPUT_VERSION"
          else
            ./scripts/release.sh
          fi
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}

      - name: "Prepare Codex prompt"
        run: |
          {
            printf 'Release preparation for %s: Rewrite changelog\n\n' "$(uv version --short)"
            cat agents/prompts/editorialize-changelog.md
          } > "$RUNNER_TEMP/editorialize-changelog-prompt.md"

      - name: "Rewrite changelog"
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.157.1"
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: "${{ runner.temp }}/editorialize-changelog-prompt.md"
          output-file: "${{ runner.temp }}/changelog-section.md"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-release-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.codex/sessions
          if-no-files-found: warn

      - name: "Apply changelog rewrite"
        run: |
          uv run scripts/update-latest-changelog-section.py \
            CHANGELOG.md \
            "$RUNNER_TEMP/changelog-section.md"

      - name: "Commit changelog rewrite"
        run: |
          git diff --check -- CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md && git diff --cached --quiet -- CHANGELOG.md; then
            echo "Codex left the generated changelog unchanged."
          else
            git -c core.hooksPath=/dev/null commit --only --message "Rewrite changelog" -- CHANGELOG.md
          fi

      - name: "Create or update pull request"
        run: |
          branch="$(git branch --show-current)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"$branch"

          pull_request="$(
            gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" --add-assignee "$GITHUB_TRIGGERING_ACTOR"
            printf '%s\n' "$pull_request"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --assignee "$GITHUB_TRIGGERING_ACTOR" \
              --fill-first
          fi
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
