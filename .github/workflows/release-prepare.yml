# Bump the uv version and create a pull request.
name: "Prepare release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to set (overrides detection)"
        required: false
        type: string

permissions: {}

env:
  UV_LOCKED: 1
  UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json

jobs:
  prepare-release:
    if: github.repository == 'astral-sh/uv'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      branch: ${{ steps.bundle.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-uv-toolchain
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: "Configure Git"
        run: |
          git config user.name "astral-automations-bot[bot]"
          git config user.email "305554984+astral-automations-bot[bot]@users.noreply.github.com"

      - name: "Bump version"
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ./scripts/release.sh --version "$INPUT_VERSION"
          else
            ./scripts/release.sh
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          ROOSTER_NO_CACHE: "1"
          INPUT_BUMP: ${{ inputs.bump }}

      - uses: astral-sh/github-actions/rewrite-changelog@8c3ce27226508d88b41427ca740b0e29adb39d9d
        with:
          prompt-file: agents/prompts/editorialize-changelog.md
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.169.0"
          model: gpt-5.6-sol
          effort: high

      - name: "Bundle release commits"
        id: bundle
        run: |
          git bundle create "$RUNNER_TEMP/prepared-release.bundle" "$GITHUB_SHA..HEAD"
          printf 'branch=%s\n' "$(git symbolic-ref --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Upload prepared release"
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared-release.bundle
          compression-level: 0
          if-no-files-found: error

  push-release:
    needs: prepare-release
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write # for the credential broker
    env:
      RELEASE_BRANCH: ${{ needs.prepare-release.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Download prepared release"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.artifact-id }}
          path: ${{ runner.temp }}/prepared-release

      - name: "Import release commits"
        run: |
          if [[ "$RELEASE_BRANCH" != release/* ]]; then
            echo "::error::Expected a release branch."
            exit 1
          fi
          release_ref="refs/heads/$RELEASE_BRANCH"
          git check-ref-format "$release_ref"

          # Import the commits without checking out the generated tree.
          bundle="$RUNNER_TEMP/prepared-release/prepared-release.bundle"
          git bundle verify "$bundle"
          git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" "HEAD:$release_ref"
          git merge-base --is-ancestor "$GITHUB_SHA" "$release_ref"

      - name: "Get uv token"
        id: token
        uses: astral-sh/github-actions/simple-token-service@4877f85420cccab15834c3d0ea3433b0d91507d3
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            contents: write
            pull_requests: write

      - name: "Create or update pull request"
        run: |
          release_ref="refs/heads/$RELEASE_BRANCH"
          git -c core.hooksPath=/dev/null push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$release_ref:$release_ref"

          pull_request="$(
            gh pr list \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -n "$pull_request" ]; then
            gh pr edit "$pull_request" --add-assignee "$GITHUB_TRIGGERING_ACTOR"
            printf '%s\n' "$pull_request"
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --assignee "$GITHUB_TRIGGERING_ACTOR" \
              --fill-first
          fi
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
