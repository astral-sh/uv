on:
  workflow_call:

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  check:
    name: "crates policies"
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for the pull request comment credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

      - name: "Check crates.io publish setup"
        id: check
        run: |
          git clone --depth=1 --quiet https://github.com/astral-sh/crates-policies.git "$RUNNER_TEMP/crates-policies"
          git -C "$RUNNER_TEMP/crates-policies" log -1 --format='crates-policies commit: %H'
          uv run "$RUNNER_TEMP/crates-policies/check.py" "$GITHUB_WORKSPACE"

      - name: "Get pull request comment token"
        id: token
        if: failure() && steps.check.outcome == 'failure'
        uses: astral-sh/github-actions/simple-token-service@eb81cf4d13127c3f9539f621c17e4c65327636c8
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: "Comment on the release pull request"
        if: failure() && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          assignees="$(gh pr view "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json assignees --jq '[.assignees[].login | "@" + .] | join(" ")')"
          body="$(cat <<EOF
          The [crates.io publishing policy check]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT) failed.

          Register any newly publishable crates in [astral-sh/crates-policies](https://github.com/astral-sh/crates-policies).
          Re-run the check after the policy is updated.
          EOF
          )"
          if [ -n "$assignees" ]; then
            printf -v body '%s\n\n%s' "$assignees" "$body"
          fi
          gh pr comment "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
