on:
  workflow_call:

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  zizmor:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: ${{ github.repository == 'astral-sh/uv' }}
