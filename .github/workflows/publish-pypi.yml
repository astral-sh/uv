# Publish a release to PyPI.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a publish job
# within `cargo-dist`.
name: "Publish to PyPI"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      uv-wheels:
        description: "Artifact ID for all verified uv release wheels"
        required: true
        type: string
      uv-build-wheels:
        description: "Artifact ID for all verified uv_build release wheels"
        required: true
        type: string
      uv-sdist:
        required: true
        type: string
      uv-build-sdist:
        required: true
        type: string

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  pypi-publish-uv:
    name: Upload uv to PyPI
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    permissions:
      id-token: write # For PyPI's trusted publishing
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: false
          ignore-empty-workdir: true
      - name: "Download uv release distributions"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.uv-wheels }},${{ inputs.uv-sdist }}
          path: wheels_uv
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish -v wheels_uv/*

  pypi-publish-uv-build:
    name: Upload uv-build to PyPI
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    permissions:
      id-token: write # For PyPI's trusted publishing
    steps:
      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: false
          ignore-empty-workdir: true
      - name: "Download uv_build release distributions"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.uv-build-wheels }},${{ inputs.uv-build-sdist }}
          path: wheels_uv_build
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish -v wheels_uv_build/*
