name: Debug symbols experiment
run-name: ${{ inputs.uv && format('uv debug symbols ({0})', inputs.platform) || 'Rust+C debug symbol fixture' }}

on:
  push:
    paths:
      - ".github/workflows/debug-symbols-experiment.yml"
      - "scripts/debug-symbols/**"
  workflow_dispatch:
    inputs:
      uv:
        description: Also compare real uv builds (slow)
        type: boolean
        default: false
      platform:
        description: Platforms on which to build uv
        type: choice
        options: [all, Linux, macOS, Windows]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  experiment:
    name: ${{ inputs.uv && (inputs.platform == 'all' || inputs.platform == matrix.os) && 'uv' || 'fixture' }} / ${{ matrix.os }}
    runs-on: ${{ inputs.uv && (inputs.platform == 'all' || inputs.platform == matrix.os) && matrix.uv-runner || matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: ${{ matrix.os == 'Linux' && 8 || 4 }}
      RUN_UV: ${{ inputs.uv && (inputs.platform == 'all' || inputs.platform == matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04-16
            uv-runner: depot-ubuntu-24.04-16
            os: Linux
            uv-checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          - runner: macos-15
            uv-runner: namespace-profile-macos-15
            os: macOS
            uv-checksum: "7e6ddb9316acc00f2296c82ff4d99977870ee34b2f0ddcae9444d714db9364ed"
          - runner: windows-2022
            uv-runner: namespace-profile-windows-2022-x86-64-16x32
            os: Windows
            uv-checksum: "a86c9dc7bad9b03f388583b7187c05fe9951c2e0d392217e8fd43d97787f6ec2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ""
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools-preview clippy rustfmt
      - name: Install Linux symbolizer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Check fixture
        run: |
          cargo fmt --manifest-path scripts/debug-symbols/Cargo.toml --check
          cargo clippy --manifest-path scripts/debug-symbols/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run experiment
        run: uv run --no-project --python 3.12 --with maturin==1.15.0 python scripts/debug-symbols/run.py
      - name: Install cargo-auditable
        if: env.RUN_UV == 'true'
        run: cargo install cargo-auditable --locked --version 0.7.6
      - name: Install NASM
        if: env.RUN_UV == 'true' && runner.os == 'Windows'
        run: |
          $version = '3.02'
          $sha256 = '0DDB40310861EB29F4D649FEB9466779982A2D251C0DB2B9CF0D21CF591171F3'
          $installer = Join-Path $env:RUNNER_TEMP "nasm-${version}-installer-x64.exe"
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$version/win64/nasm-${version}-installer-x64.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $sha256) {
            throw 'NASM installer checksum mismatch'
          }
          $installation = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NASM installation failed: $($installation.ExitCode)"
          }
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run uv experiment
        if: env.RUN_UV == 'true'
        run: uv run --no-project --python 3.12 --with maturin==1.15.0 python scripts/debug-symbols/run_uv.py
      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ runner.os }}-${{ runner.arch }}
          path: target/debug-symbols-experiment
          if-no-files-found: error
          retention-days: 7
      - name: Upload uv experiment outputs
        if: always() && env.RUN_UV == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-debug-symbols-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/uv-debug-symbols-experiment
            !target/uv-debug-symbols-experiment/**/*.original.whl
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
