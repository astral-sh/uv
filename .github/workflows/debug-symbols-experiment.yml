name: Debug symbols experiment

on:
  push:
    paths:
      - ".github/workflows/debug-symbols-experiment.yml"
      - "scripts/debug-symbols/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            uv-checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          - runner: macos-15
            uv-checksum: "7e6ddb9316acc00f2296c82ff4d99977870ee34b2f0ddcae9444d714db9364ed"
          - runner: windows-2022
            uv-checksum: "a86c9dc7bad9b03f388583b7187c05fe9951c2e0d392217e8fd43d97787f6ec2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ""
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools-preview clippy rustfmt
      - name: Install Linux symbolizer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Check fixture
        run: |
          cargo fmt --manifest-path scripts/debug-symbols/Cargo.toml --check
          cargo clippy --manifest-path scripts/debug-symbols/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run experiment
        run: uv run --no-project --python 3.12 --with maturin==1.15.0 python scripts/debug-symbols/run.py
      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ runner.os }}-${{ runner.arch }}
          path: target/debug-symbols-experiment
          if-no-files-found: error
          retention-days: 7
