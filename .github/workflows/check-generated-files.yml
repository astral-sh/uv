on:
  workflow_call:
    inputs:
      schema-changed:
        required: true
        type: string
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  cargo-dev-generate-all:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    name: "cargo dev generate-all"
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}
      - name: "Generate all"
        run: cargo --locked dev generate-all --mode dry-run
      - name: "Check sysconfig mappings"
        run: cargo --locked dev generate-sysconfig-metadata --mode check
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - name: "Check Packse scenario tests"
        run: cargo --locked dev generate-scenario-tests --mode check
      - name: "Check JSON schema"
        if: ${{ inputs.schema-changed == 'true' }}
        run: cargo --locked dev generate-json-schema --mode check
      - name: "Check uv-extract dirhash test vectors"
        run: cargo --locked dev generate-dirhash-test-vectors --mode check
