# Keep this in sync with the Cargo package rule in `renovate.json5`.
cooldown-days = 7

# Exclusions require an exact crate name and a reason. Include `version` to limit
# an exclusion to one release; omit it to exclude every version of the crate.
exclusions = []

# Replace the empty list above with entries like:
# [[exclusions]]
# name = "example-crate"
# version = "1.2.3"
# reason = "Explain why this release needs an exception."
